<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiplayer Roulette</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: white;
            min-height: 100vh;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            padding: 15px;
        }

        .header {
            text-align: center;
            margin-bottom: 15px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
        }

        .balance-info {
            display: flex;
            justify-content: space-between;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 15px;
        }

        .room-info {
            background: rgba(255, 255, 255, 0.1);
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 15px;
            text-align: center;
        }

        /* Рулетка */
        .roulette-container {
            position: relative;
            margin: 20px 0;
        }

        .roulette-wheel {
            width: 300px;
            height: 300px;
            margin: 0 auto;
            border: 8px solid #d4af37;
            border-radius: 50%;
            position: relative;
            overflow: hidden;
            background: #0a5f38;
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.5);
        }

        .roulette-numbers {
            position: absolute;
            width: 100%;
            height: 100%;
            list-style: none;
        }

        .number {
            position: absolute;
            width: 50px;
            height: 50px;
            background: red;
            border: 2px solid gold;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            transform-origin: center;
        }

        .number.zero { background: green; }
        .number.red { background: #d32f2f; }
        .number.black { background: #212121; }

        .roulette-ball {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 25px;
            height: 25px;
            background: radial-gradient(circle at 30% 30%, #ffffff, #d4af37);
            border-radius: 50%;
            z-index: 10;
            box-shadow: 0 0 10px gold;
        }

        /* Ставки */
        .betting-interface {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 15px;
        }

        .bet-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .bet-amount {
            font-size: 1.2em;
            font-weight: bold;
            color: #d4af37;
        }

        .bet-buttons {
            display: flex;
            gap: 10px;
        }

        .bet-btn {
            background: #667eea;
            border: none;
            color: white;
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
        }

        .bet-types {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }

        .bet-type {
            background: rgba(255, 255, 255, 0.2);
            padding: 10px;
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .bet-type.active {
            background: #d4af37;
            color: #000;
        }

        .place-bet-btn {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            border: none;
            color: white;
            padding: 15px;
            border-radius: 25px;
            font-size: 1.1em;
            cursor: pointer;
            width: 100%;
        }

        /* Игроки */
        .players-list {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 15px;
            max-height: 200px;
            overflow-y: auto;
        }

        .player {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .player:last-child {
            border-bottom: none;
        }

        .player-bet {
            color: #d4af37;
            font-weight: bold;
        }

        /* Таймер */
        .timer {
            text-align: center;
            font-size: 1.5em;
            font-weight: bold;
            color: #d4af37;
            margin: 10px 0;
        }

        /* Результаты */
        .results {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 15px;
            margin-top: 15px;
        }

        .winning-number {
            text-align: center;
            font-size: 2em;
            font-weight: bold;
            color: #d4af37;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎡 Multiplayer Roulette</h1>
            <p>Играйте с реальными игроками в реальном времени!</p>
        </div>

        <div class="balance-info">
            <div>
                <div>Ваш баланс</div>
                <div class="balance-amount" id="balanceAmount">1000 USD</div>
            </div>
            <div>
                <div>Игроков онлайн</div>
                <div id="onlineCount">12</div>
            </div>
        </div>

        <div class="room-info">
            <div>Комната: <strong>#RUS-001</strong></div>
            <div>Минимальная ставка: <strong>10 USD</strong></div>
        </div>

        <div class="timer" id="timer">00:30</div>

        <div class="roulette-container">
            <div class="roulette-wheel" id="rouletteWheel">
                <div class="roulette-ball" id="rouletteBall"></div>
                <div class="roulette-numbers" id="rouletteNumbers"></div>
            </div>
        </div>

        <div class="betting-interface">
            <div class="bet-controls">
                <div>
                    <div>Ваша ставка</div>
                    <div class="bet-amount" id="currentBet">50 USD</div>
                </div>
                <div class="bet-buttons">
                    <button class="bet-btn" onclick="changeBet(-10)">-10</button>
                    <button class="bet-btn" onclick="changeBet(10)">+10</button>
                    <button class="bet-btn" onclick="changeBet(100)">+100</button>
                </div>
            </div>

            <div class="bet-types">
                <div class="bet-type active" data-type="number" onclick="selectBetType('number')">
                    Число (x36)
                </div>
                <div class="bet-type" data-type="red_black" onclick="selectBetType('red_black')">
                    Красное/Черное (x2)
                </div>
                <div class="bet-type" data-type="dozen" onclick="selectBetType('dozen')">
                    Дюжина (x3)
                </div>
                <div class="bet-type" data-type="even_odd" onclick="selectBetType('even_odd')">
                    Чет/Нечет (x2)
                </div>
            </div>

            <div id="numberSelection" style="display: block;">
                <div style="display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; margin-bottom: 10px;">
                    <!-- Числа 0-36 -->
                </div>
            </div>

            <div id="colorSelection" style="display: none; text-align: center; margin-bottom: 10px;">
                <button class="bet-btn" style="background: #d32f2f;" onclick="selectColor('red')">🔴 Красное</button>
                <button class="bet-btn" style="background: #212121;" onclick="selectColor('black')">⚫ Черное</button>
            </div>

            <button class="place-bet-btn" onclick="placeBet()">🎯 Сделать ставку</button>
        </div>

        <div class="players-list" id="playersList">
            <h3>Игроки в комнате:</h3>
            <!-- Список игроков будет здесь -->
        </div>

        <div class="results" id="results" style="display: none;">
            <h3>Результаты раунда:</h3>
            <div class="winning-number" id="winningNumber">0</div>
            <div id="winnersList"></div>
        </div>
    </div>

    <script>
        // Telegram WebApp API
        const tg = window.Telegram.WebApp;
        
        // Инициализация
        tg.expand();
        tg.BackButton.hide();

        // Данные игры
        const gameState = {
            balance: 1000,
            currentBet: 50,
            selectedBetType: 'number',
            selectedNumber: null,
            selectedColor: null,
            players: [],
            roundTime: 30,
            timer: null,
            isBettingPhase: true,
            totalPot: 0
        };

        // Рулетка числа (0-36)
        const rouletteNumbers = [
            {number: 0, color: 'green'},
            {number: 32, color: 'red'}, {number: 15, color: 'black'}, {number: 19, color: 'red'},
            {number: 4, color: 'black'}, {number: 21, color: 'red'}, {number: 2, color: 'black'},
            {number: 25, color: 'red'}, {number: 17, color: 'black'}, {number: 34, color: 'red'},
            {number: 6, color: 'black'}, {number: 27, color: 'red'}, {number: 13, color: 'black'},
            {number: 36, color: 'red'}, {number: 11, color: 'black'}, {number: 30, color: 'red'},
            {number: 8, color: 'black'}, {number: 23, color: 'red'}, {number: 10, color: 'black'},
            {number: 5, color: 'red'}, {number: 24, color: 'black'}, {number: 16, color: 'red'},
            {number: 33, color: 'black'}, {number: 1, color: 'red'}, {number: 20, color: 'black'},
            {number: 14, color: 'red'}, {number: 31, color: 'black'}, {number: 9, color: 'red'},
            {number: 22, color: 'black'}, {number: 18, color: 'red'}, {number: 29, color: 'black'},
            {number: 7, color: 'red'}, {number: 28, color: 'black'}, {number: 12, color: 'red'},
            {number: 35, color: 'black'}, {number: 3, color: 'red'}, {number: 26, color: 'black'}
        ];

        // Инициализация
        document.addEventListener('DOMContentLoaded', function() {
            initRouletteWheel();
            updateBalanceDisplay();
            updateBetDisplay();
            generateNumberGrid();
            startRoundTimer();
            simulateOtherPlayers();
        });

        // Создание рулетки
        function initRouletteWheel() {
            const numbersContainer = document.getElementById('rouletteNumbers');
            const angleStep = 360 / rouletteNumbers.length;
            
            rouletteNumbers.forEach((num, index) => {
                const numberElement = document.createElement('div');
                numberElement.className = `number ${num.color}`;
                numberElement.textContent = num.number;
                numberElement.style.transform = `rotate(${index * angleStep}deg) translate(130px) rotate(-${index * angleStep}deg)`;
                numberElement.onclick = () => selectNumber(num.number);
                numbersContainer.appendChild(numberElement);
            });
        }

        // Сетка чисел для ставок
        function generateNumberGrid() {
            const container = document.querySelector('#numberSelection div');
            for (let i = 0; i <= 36; i++) {
                const btn = document.createElement('button');
                btn.className = 'bet-btn';
                btn.textContent = i;
                btn.style.background = getNumberColor(i);
                btn.onclick = () => selectNumber(i);
                container.appendChild(btn);
            }
        }

        function getNumberColor(number) {
            if (number === 0) return 'green';
            const redNumbers = [1, 3, 5, 7, 9, 12, 14, 16, 18, 19, 21, 23, 25, 27, 30, 32, 34, 36];
            return redNumbers.includes(number) ? '#d32f2f' : '#212121';
        }

        // Изменение ставки
        function changeBet(amount) {
            gameState.currentBet = Math.max(10, gameState.currentBet + amount);
            updateBetDisplay();
        }

        function updateBetDisplay() {
            document.getElementById('currentBet').textContent = gameState.currentBet + ' USD';
        }

        function updateBalanceDisplay() {
            document.getElementById('balanceAmount').textContent = gameState.balance + ' USD';
        }

        // Выбор типа ставки
        function selectBetType(type) {
            gameState.selectedBetType = type;
            
            // Обновляем активные кнопки
            document.querySelectorAll('.bet-type').forEach(btn => {
                btn.classList.remove('active');
            });
            document.querySelector(`[data-type="${type}"]`).classList.add('active');
            
            // Показываем соответствующий интерфейс
            document.getElementById('numberSelection').style.display = type === 'number' ? 'block' : 'none';
            document.getElementById('colorSelection').style.display = type === 'red_black' ? 'block' : 'none';
            
            gameState.selectedNumber = null;
            gameState.selectedColor = null;
        }

        function selectNumber(number) {
            gameState.selectedNumber = number;
            gameState.selectedColor = null;
            
            // Подсветка выбранного числа
            document.querySelectorAll('#numberSelection .bet-btn').forEach(btn => {
                btn.style.opacity = btn.textContent == number ? '1' : '0.6';
            });
        }

        function selectColor(color) {
            gameState.selectedColor = color;
            gameState.selectedNumber = null;
            
            document.querySelectorAll('#colorSelection .bet-btn').forEach(btn => {
                btn.style.opacity = btn.textContent.includes(color) ? '1' : '0.6';
            });
        }

        // Размещение ставки
        function placeBet() {
            if (!gameState.isBettingPhase) {
                showMessage('Ставки в этом раунде закрыты!');
                return;
            }
            
            if (gameState.currentBet > gameState.balance) {
                showMessage('Недостаточно средств!');
                return;
            }
            
            let betValid = false;
            switch (gameState.selectedBetType) {
                case 'number':
                    betValid = gameState.selectedNumber !== null;
                    break;
                case 'red_black':
                    betValid = gameState.selectedColor !== null;
                    break;
                case 'dozen':
                case 'even_odd':
                    betValid = true; // Всегда валидно для этих типов
                    break;
            }
            
            if (!betValid) {
                showMessage('Выберите число или цвет для ставки!');
                return;
            }
            
            // Вычитаем ставку
            gameState.balance -= gameState.currentBet;
            updateBalanceDisplay();
            
            // Добавляем игрока в список
            addPlayerBet({
                name: 'Вы',
                bet: gameState.currentBet,
                type: gameState.selectedBetType,
                selection: gameState.selectedNumber !== null ? gameState.selectedNumber : gameState.selectedColor
            });
            
            showMessage(`Ставка размещена: ${gameState.currentBet} USD`);
            
            // Отправляем данные в бота
            sendBetToBot();
        }

        // Таймер раунда
        function startRoundTimer() {
            let timeLeft = gameState.roundTime;
            gameState.timer = setInterval(() => {
                document.getElementById('timer').textContent = 
                    `00:${timeLeft.toString().padStart(2, '0')}`;
                
                if (timeLeft <= 0) {
                    clearInterval(gameState.timer);
                    endBettingPhase();
                }
                
                // Меняем цвет таймера при приближении к концу
                if (timeLeft <= 10) {
                    document.getElementById('timer').style.color = '#ff6b6b';
                }
                
                timeLeft--;
            }, 1000);
        }

        function endBettingPhase() {
            gameState.isBettingPhase = false;
            document.getElementById('timer').textContent = 'Крутим...';
            spinRoulette();
        }

        // Анимация рулетки
        function spinRoulette() {
            const wheel = document.getElementById('rouletteWheel');
            const ball = document.getElementById('rouletteBall');
            
            // Случайное вращение
            const spins = 5 + Math.random() * 3; // 5-8 полных оборотов
            const winningIndex = Math.floor(Math.random() * rouletteNumbers.length);
            const winningNumber = rouletteNumbers[winningIndex];
            
            // Анимация вращения
            wheel.style.transition = 'transform 5s cubic-bezier(0.1, 0.8, 0.2, 1)';
            wheel.style.transform = `rotate(${spins * 360 + winningIndex * (360 / rouletteNumbers.length)}deg)`;
            
            // Анимация шарика
            setTimeout(() => {
                ball.style.transition = 'all 0.5s';
                ball.style.transform = `translate(-50%, -50%) translateX(${Math.cos(winningIndex * (360 / rouletteNumbers.length) * Math.PI / 180) * 120}px) translateY(${Math.sin(winningIndex * (360 / rouletteNumbers.length) * Math.PI / 180) * 120}px)`;
            }, 4500);
            
            // Показ результатов
            setTimeout(() => {
                showResults(winningNumber);
            }, 6000);
        }

        // Показ результатов
        function showResults(winningNumber) {
            document.getElementById('results').style.display = 'block';
            document.getElementById('winningNumber').textContent = winningNumber.number;
            document.getElementById('winningNumber').style.color = winningNumber.color === 'red' ? '#d32f2f' : 
                                                                  winningNumber.color === 'black' ? '#212121' : 'green';
            
            // Расчет выигрышей
            calculateWinnings(winningNumber);
            
            // Новый раунд через 10 секунд
            setTimeout(() => {
                startNewRound();
            }, 10000);
        }

        function calculateWinnings(winningNumber) {
            const winners = [];
            let totalWinnings = 0;
            
            // Проверяем всех игроков
            gameState.players.forEach(player => {
                let winAmount = 0;
                let isWinner = false;
                
                switch (player.type) {
                    case 'number':
                        if (player.selection === winningNumber.number) {
                            winAmount = player.bet * 36;
                            isWinner = true;
                        }
                        break;
                    case 'red_black':
                        if ((player.selection === 'red' && winningNumber.color === 'red') ||
                            (player.selection === 'black' && winningNumber.color === 'black')) {
                            winAmount = player.bet * 2;
                            isWinner = true;
                        }
                        break;
                    case 'dozen':
                        // Упрощенная логика для дюжины
                        if (winningNumber.number >= 1 && winningNumber.number <= 12) {
                            winAmount = player.bet * 3;
                            isWinner = true;
                        }
                        break;
                    case 'even_odd':
                        if ((player.selection === 'even' && winningNumber.number % 2 === 0 && winningNumber.number !== 0) ||
                            (player.selection === 'odd' && winningNumber.number % 2 === 1)) {
                            winAmount = player.bet * 2;
                            isWinner = true;
                        }
                        break;
                }
                
                if (isWinner) {
                    winners.push({
                        name: player.name,
                        win: winAmount,
                        bet: player.bet
                    });
                    totalWinnings += winAmount;
                    
                    // Начисляем выигрыш текущему игроку
                    if (player.name === 'Вы') {
                        gameState.balance += winAmount;
                        updateBalanceDisplay();
                    }
                }
            });
            
            // Показываем список победителей
            showWinnersList(winners);
        }

        function showWinnersList(winners) {
            const container = document.getElementById('winnersList');
            container.innerHTML = '';
            
            if (winners.length === 0) {
                container.innerHTML = '<p>В этом раунде никто не выиграл</p>';
                return;
            }
            
            winners.forEach(winner => {
                const div = document.createElement('div');
                div.className = 'player';
                div.innerHTML = `
                    <span>${winner.name}</span>
                    <span class="player-bet">+${winner.win} USD</span>
                `;
                container.appendChild(div);
            });
        }

        function startNewRound() {
            gameState.isBettingPhase = true;
            gameState.players = [];
            document.getElementById('results').style.display = 'none';
            document.getElementById('playersList').innerHTML = '<h3>Игроки в комнате:</h3>';
            document.getElementById('timer').style.color = '#d4af37';
            startRoundTimer();
        }

        // Симуляция других игроков
        function simulateOtherPlayers() {
            setInterval(() => {
                if (gameState.isBettingPhase && Math.random() > 0.7) {
                    const names = ['Иван', 'Мария', 'Алексей', 'Ольга', 'Дмитрий', 'Анна'];
                    const betTypes = ['number', 'red_black', 'dozen', 'even_odd'];
                    
                    addPlayerBet({
                        name: names[Math.floor(Math.random() * names.length)],
                        bet: Math.floor(Math.random() * 100) + 10,
                        type: betTypes[Math.floor(Math.random() * betTypes.length)],
                        selection: Math.random() > 0.5 ? 'red' : 'black'
                    });
                }
            }, 3000);
        }

        function addPlayerBet(player) {
            gameState.players.push(player);
            
            const container = document.getElementById('playersList');
            const div = document.createElement('div');
            div.className = 'player';
            div.innerHTML = `
                <span>${player.name}</span>
                <span class="player-bet">${player.bet} USD</span>
            `;
            container.appendChild(div);
        }

        function showMessage(text) {
            // Простая реализация показа сообщений
            console.log(text);
            // В реальном приложении можно использовать toast уведомления
        }

        function sendBetToBot() {
            if (tg && tg.sendData) {
                const betData = {
                    type: 'roulette_bet',
                    bet: gameState.currentBet,
                    betType: gameState.selectedBetType,
                    selection: gameState.selectedNumber !== null ? gameState.selectedNumber : gameState.selectedColor,
                    timestamp: Date.now()
                };
                tg.sendData(JSON.stringify(betData));
            }
        }
    </script>
</body>
</html>
