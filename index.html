<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Casino</title>
    <style>
        /* Основные стили */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0c0f1d 0%, #1a1f3b 100%);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            position: relative;
            overflow: hidden;
        }

        /* Анимированный фон */
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: radial-gradient(circle at 20% 80%, rgba(41, 128, 185, 0.1) 0%, transparent 50%),
                        radial-gradient(circle at 80% 20%, rgba(231, 76, 60, 0.1) 0%, transparent 50%),
                        radial-gradient(circle at 40% 40%, rgba(46, 204, 113, 0.1) 0%, transparent 50%);
            animation: pulse 15s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        /* Главный экран */
        #mainScreen {
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .header {
            text-align: center;
            padding: 20px 0;
            position: relative;
            overflow: hidden;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .header h1 {
            font-size: 2.2rem;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #FFD700, #FFA500, #FF8C00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
        }

        .header p {
            font-size: 1rem;
            opacity: 0.8;
        }

        .balance-card {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: transform 0.3s ease;
        }

        .balance-card:hover {
            transform: translateY(-5px);
        }

        .balance-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            transform: translateX(-100%);
            transition: transform 0.6s;
        }

        .balance-card:hover::before {
            transform: translateX(100%);
        }

        .balance-card > div:first-child {
            font-size: 0.9rem;
            opacity: 0.8;
            margin-bottom: 5px;
        }

        .balance-amount {
            font-size: 2rem;
            font-weight: bold;
            margin: 10px 0;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        .balance-card > div:last-child {
            font-size: 0.8rem;
            opacity: 0.7;
        }

        /* Сетка игр */
        .games-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .game-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 120px;
        }

        .game-card:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
        }

        .game-icon {
            font-size: 2.5rem;
            margin-bottom: 10px;
            filter: drop-shadow(0 0 5px rgba(255, 255, 255, 0.5));
        }

        .game-card:nth-child(1) .game-icon { color: #FFD700; }
        .game-card:nth-child(2) .game-icon { color: #FF6347; }
        .game-card:nth-child(3) .game-icon { color: #1E90FF; }
        .game-card:nth-child(4) .game-icon { color: #32CD32; }

        /* Кнопки */
        .spin-btn {
            background: linear-gradient(135deg, #FF8C00 0%, #FFA500 100%);
            border: none;
            border-radius: 50px;
            color: white;
            padding: 15px 30px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(255, 140, 0, 0.4);
            width: 100%;
            margin-top: 10px;
        }

        .spin-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(255, 140, 0, 0.6);
        }

        .spin-btn:active {
            transform: translateY(1px);
        }

        /* Модальное окно */
        .game-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            backdrop-filter: blur(5px);
        }

        .modal-content {
            position: relative;
            background: linear-gradient(135deg, #1a1f3b 0%, #0c0f1d 100%);
            margin: 5% auto;
            padding: 30px;
            width: 95%;
            max-width: 500px;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-height: 90vh;
            overflow-y: auto;
        }

        .close-modal {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 2rem;
            cursor: pointer;
            color: rgba(255, 255, 255, 0.7);
            transition: color 0.3s;
            z-index: 10;
        }

        .close-modal:hover {
            color: white;
        }

        /* Элементы управления ставками */
        .bet-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 15px;
            margin: 20px 0;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .bet-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin: 0 5px;
            transition: all 0.3s ease;
        }

        .bet-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.1);
        }

        /* Рулетка - УЛУЧШЕННАЯ ВЕРСИЯ */
        .roulette-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 20px 0;
        }

        .roulette-wheel {
            width: 280px;
            height: 280px;
            margin: 20px auto;
            border: 8px solid #FFD700;
            border-radius: 50%;
            position: relative;
            overflow: hidden;
            transition: transform 4s cubic-bezier(0.2, 0.8, 0.1, 0.9);
            background: #0a5f38; /* Зеленый фон для нуля */
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.5);
        }

        .roulette-ball {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 16px;
            height: 16px;
            background: radial-gradient(circle at 30% 30%, #FFF, #FFD700);
            border-radius: 50%;
            z-index: 10;
            box-shadow: 0 0 8px gold;
        }

        .roulette-marker {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 4px;
            height: 30px;
            background: #FF0000;
            z-index: 5;
            box-shadow: 0 0 10px red;
        }

        .roulette-sectors {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
        }

        .roulette-sector {
            position: absolute;
            width: 50%;
            height: 50%;
            left: 50%;
            top: 0;
            transform-origin: left bottom;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 10px;
            font-size: 14px;
            font-weight: bold;
            color: white;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }

        .bet-options {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin: 20px 0;
            width: 100%;
        }

        .bet-option {
            padding: 15px 10px;
            border: none;
            border-radius: 10px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .bet-option.red { 
            background: linear-gradient(135deg, #c00 0%, #a00 100%);
        }
        .bet-option.black { 
            background: linear-gradient(135deg, #000 0%, #333 100%);
        }
        .bet-option.green { 
            background: linear-gradient(135deg, #0a5f38 0%, #0a3f28 100%);
        }
        .bet-option.even { 
            background: linear-gradient(135deg, #2196F3 0%, #0d47a1 100%);
        }
        .bet-option.odd { 
            background: linear-gradient(135deg, #FF9800 0%, #E65100 100%);
        }
        .bet-option.low { 
            background: linear-gradient(135deg, #9C27B0 0%, #4A148C 100%);
        }
        .bet-option.high { 
            background: linear-gradient(135deg, #607D8B 0%, #37474F 100%);
        }

        .bet-option.active {
            transform: scale(1.05);
            box-shadow: 0 0 15px gold;
            border: 2px solid gold;
        }

        .bet-option:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }

        .roulette-history {
            display: flex;
            gap: 8px;
            margin: 20px 0;
            justify-content: center;
            flex-wrap: wrap;
        }

        .history-item {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
            color: white;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.2);
        }

        .history-item.red { background: #c00; }
        .history-item.black { background: #000; }
        .history-item.green { background: #0a5f38; }

        /* Игра в кости */
        .dice-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 30px 0;
        }

        .dice {
            width: 80px;
            height: 80px;
            background: white;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            border: 2px solid #FFD700;
        }

        .dice-rolling {
            animation: diceRoll 0.5s infinite;
        }

        @keyframes diceRoll {
            0% { transform: rotate(0deg) scale(1); }
            25% { transform: rotate(90deg) scale(1.1); }
            50% { transform: rotate(180deg) scale(1); }
            75% { transform: rotate(270deg) scale(1.1); }
            100% { transform: rotate(360deg) scale(1); }
        }

        .dice-bet-options {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 20px 0;
            flex-wrap: wrap;
        }

        .dice-bet {
            padding: 10px 15px;
            border: none;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .dice-bet.active {
            background: linear-gradient(135deg, #FF8C00 0%, #FFA500 100%);
            transform: scale(1.05);
        }

        /* Сообщения о результате */
        .result-message {
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            font-weight: bold;
            margin: 20px 0;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            animation: fadeIn 0.5s ease;
        }

        .result-message.win {
            background: linear-gradient(135deg, #4CAF50 0%, #2E7D32 100%);
            border: 1px solid #81C784;
        }

        .result-message.lose {
            background: linear-gradient(135deg, #F44336 0%, #C62828 100%);
            border: 1px solid #EF5350;
        }

        .result-message.draw {
            background: linear-gradient(135deg, #FF9800 0%, #E65100 100%);
            border: 1px solid #FFB74D;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Адаптивность */
        @media (max-width: 480px) {
            .games-grid {
                grid-template-columns: 1fr;
            }
            
            .bet-options {
                grid-template-columns: 1fr;
            }
            
            .roulette-wheel {
                width: 250px;
                height: 250px;
            }
            
            .dice-container {
                gap: 10px;
            }
            
            .dice {
                width: 70px;
                height: 70px;
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="bg-animation"></div>
    <div class="container">
        <!-- Главный экран -->
        <div id="mainScreen">
            <div class="header">
                <h1>🎰 Crypto Casino</h1>
                <p>Ваш путь к большим выигрышам!</p>
            </div>

            <div class="balance-card">
                <div>Ваш баланс</div>
                <div class="balance-amount" id="balanceAmount">1000 USD</div>
                <div>ID: <span id="userId">123456</span></div>
            </div>

            <div class="games-grid">
                <div class="game-card" onclick="openGame('slots')">
                    <div class="game-icon">🎰</div>
                    <div>Слоты</div>
                </div>
                <div class="game-card" onclick="openGame('roulette')">
                    <div class="game-icon">🎡</div>
                    <div>Рулетка</div>
                </div>
                <div class="game-card" onclick="openGame('blackjack')">
                    <div class="game-icon">♠️</div>
                    <div>Блэкджек</div>
                </div>
                <div class="game-card" onclick="openGame('dice')">
                    <div class="game-icon">🎲</div>
                    <div>Кости</div>
                </div>
            </div>

            <button class="spin-btn" onclick="refreshBalance()">🔄 Обновить баланс</button>
        </div>

        <!-- Модальное окно для игр -->
        <div id="gameModal" class="game-modal">
            <div class="modal-content">
                <span class="close-modal" onclick="closeGame()">×</span>
                <div id="gameContent"></div>
            </div>
        </div>
    </div>

    <script>
        // Telegram WebApp API
        const tg = window.Telegram?.WebApp || {};
        
        // Инициализация
        if (tg.expand) tg.expand();
        if (tg.BackButton) tg.BackButton.hide();

        // Данные пользователя
        let userData = {
            balance: 1000,
            userId: tg.initDataUnsafe?.user?.id || '123456',
            bets: {
                slots: 10,
                roulette: 50,
                blackjack: 25,
                dice: 20
            }
        };

        // Данные для рулетки - УЛУЧШЕННАЯ ВЕРСИЯ
        let rouletteData = {
            spinning: false,
            currentBet: null,
            history: [],
            numbers: [
                0, 32, 15, 19, 4, 21, 2, 25, 17, 34, 6, 27, 13, 36, 11, 30, 8, 23, 10, 5, 24, 16, 33, 1, 20, 14, 31, 9, 22, 18, 29, 7, 28, 12, 35, 3, 26
            ],
            redNumbers: [32, 19, 21, 25, 34, 27, 36, 30, 23, 5, 16, 1, 14, 9, 18, 7, 12, 3],
            blackNumbers: [15, 4, 2, 17, 6, 13, 11, 8, 10, 24, 33, 20, 31, 22, 29, 28, 35, 26],
            sectors: []
        };

        // Данные для игры в кости
        let diceData = {
            rolling: false,
            currentBet: null,
            betAmount: 20,
            playerScore: 0,
            houseScore: 0
        };

        // Инициализация баланса
        document.getElementById('balanceAmount').textContent = userData.balance + ' USD';
        document.getElementById('userId').textContent = userData.userId;

        // Функции для игр
        function openGame(gameType) {
            const modal = document.getElementById('gameModal');
            const gameContent = document.getElementById('gameContent');
            
            switch(gameType) {
                case 'slots':
                    gameContent.innerHTML = getSlotsHTML();
                    initSlots();
                    break;
                case 'roulette':
                    gameContent.innerHTML = getRouletteHTML();
                    initRoulette();
                    break;
                case 'blackjack':
                    gameContent.innerHTML = getBlackjackHTML();
                    initBlackjack();
                    break;
                case 'dice':
                    gameContent.innerHTML = getDiceHTML();
                    initDice();
                    break;
            }
            
            modal.style.display = 'block';
            if (tg.BackButton) {
                tg.BackButton.show();
                tg.BackButton.onClick(closeGame);
            }
        }

        function closeGame() {
            document.getElementById('gameModal').style.display = 'none';
            if (tg.BackButton) tg.BackButton.hide();
        }

        function refreshBalance() {
            if (tg.showPopup) {
                tg.showPopup({
                    title: 'Обновление баланса',
                    message: 'Запрашиваем актуальный баланс...',
                    buttons: [{ type: 'ok' }]
                });
            }

            setTimeout(() => {
                userData.balance += Math.random() * 100 - 50;
                document.getElementById('balanceAmount').textContent = userData.balance.toFixed(2) + ' USD';
            }, 1000);
        }

        // Игра: Слоты
        function getSlotsHTML() {
            return `
                <h2 style="text-align: center; margin-bottom: 20px; background: linear-gradient(90deg, #FFD700, #FFA500); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">🎰 Игровые автоматы</h2>
                <div class="bet-controls">
                    <span>Ставка: <span id="slotsBet">${userData.bets.slots}</span> USD</span>
                    <div>
                        <button class="bet-btn" onclick="changeBet('slots', -5)">-5</button>
                        <button class="bet-btn" onclick="changeBet('slots', 5)">+5</button>
                    </div>
                </div>
                <div class="slots-container">
                    <div class="slot" id="slot1">🍒</div>
                    <div class="slot" id="slot2">🍋</div>
                    <div class="slot" id="slot3">🍊</div>
                </div>
                <button class="spin-btn" onclick="spinSlots()">🎰 Крутить!</button>
                <div id="slotsResult"></div>
            `;
        }

        function spinSlots() {
            const bet = userData.bets.slots;
            if (userData.balance < bet) {
                showResult('Недостаточно средств!', 'lose');
                return;
            }

            userData.balance -= bet;
            updateBalance();

            const symbols = ['🍒', '🍋', '🍊', '⭐', '🔔', '💎'];
            const slots = ['slot1', 'slot2', 'slot3'];
            
            // Добавляем анимацию вращения
            slots.forEach(slotId => {
                document.getElementById(slotId).classList.add('spinning');
            });
            
            let spins = 0;
            const spinInterval = setInterval(() => {
                slots.forEach(slotId => {
                    const randomSymbol = symbols[Math.floor(Math.random() * symbols.length)];
                    document.getElementById(slotId).textContent = randomSymbol;
                });
                spins++;
                
                if (spins > 20) {
                    clearInterval(spinInterval);
                    
                    // Убираем анимацию вращения
                    slots.forEach(slotId => {
                        document.getElementById(slotId).classList.remove('spinning');
                    });
                    
                    const results = [
                        symbols[Math.floor(Math.random() * symbols.length)],
                        symbols[Math.floor(Math.random() * symbols.length)],
                        symbols[Math.floor(Math.random() * symbols.length)]
                    ];
                    
                    slots.forEach((slotId, index) => {
                        document.getElementById(slotId).textContent = results[index];
                    });

                    if (results[0] === results[1] && results[1] === results[2]) {
                        const winAmount = bet * 10;
                        userData.balance += winAmount;
                        showResult(`ДЖЕКПОТ! Вы выиграли ${winAmount} USD!`, 'win');
                        sendGameResult('slots', true, winAmount);
                    } else if (results[0] === results[1] || results[1] === results[2]) {
                        const winAmount = bet * 2;
                        userData.balance += winAmount;
                        showResult(`Вы выиграли ${winAmount} USD!`, 'win');
                        sendGameResult('slots', true, winAmount);
                    } else {
                        showResult('Повезет в следующий раз!', 'lose');
                        sendGameResult('slots', false, 0);
                    }
                    updateBalance();
                }
            }, 100);
        }

        // Игра: Рулетка - УЛУЧШЕННАЯ ВЕРСИЯ
        function getRouletteHTML() {
            return `
                <h2 style="text-align: center; margin-bottom: 20px; background: linear-gradient(90deg, #FF6347, #FF4500); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">🎡 Европейская рулетка</h2>
                <div class="bet-controls">
                    <span>Ставка: <span id="rouletteBet">${userData.bets.roulette}</span> USD</span>
                    <div>
                        <button class="bet-btn" onclick="changeBet('roulette', -10)">-10</button>
                        <button class="bet-btn" onclick="changeBet('roulette', 10)">+10</button>
                    </div>
                </div>
                
                <div class="roulette-container">
                    <div class="roulette-wheel" id="rouletteWheel">
                        <div class="roulette-ball"></div>
                        <div class="roulette-marker"></div>
                        <div class="roulette-sectors" id="rouletteSectors"></div>
                    </div>
                </div>
                
                <div class="bet-options">
                    <button class="bet-option red" onclick="selectRouletteBet('red')">🔴 Красное (x2)</button>
                    <button class="bet-option black" onclick="selectRouletteBet('black')">⚫ Черное (x2)</button>
                    <button class="bet-option green" onclick="selectRouletteBet('green')">🟢 0 (x14)</button>
                    <button class="bet-option even" onclick="selectRouletteBet('even')">📊 Четное (x2)</button>
                    <button class="bet-option odd" onclick="selectRouletteBet('odd')">🔢 Нечетное (x2)</button>
                    <button class="bet-option low" onclick="selectRouletteBet('low')">🔽 1-18 (x2)</button>
                    <button class="bet-option high" onclick="selectRouletteBet('high')">🔼 19-36 (x2)</button>
                </div>
                
                <button class="spin-btn" id="spinRoulette" onclick="spinRoulette()" disabled>🎡 Крутить рулетку</button>
                
                <div class="roulette-history" id="rouletteHistory"></div>
                <div id="rouletteResult"></div>
            `;
        }

        function initRoulette() {
            updateRouletteHistory();
            rouletteData.spinning = false;
            rouletteData.currentBet = null;
            
            // Сбрасываем активные кнопки
            document.querySelectorAll('.bet-option').forEach(btn => {
                btn.classList.remove('active');
            });
            document.getElementById('spinRoulette').disabled = true;
            
            // Создаем сектора рулетки
            createRouletteSectors();
        }

        function createRouletteSectors() {
            const sectorsContainer = document.getElementById('rouletteSectors');
            sectorsContainer.innerHTML = '';
            
            const anglePerSector = 360 / rouletteData.numbers.length;
            
            rouletteData.numbers.forEach((number, index) => {
                const sector = document.createElement('div');
                sector.className = 'roulette-sector';
                sector.textContent = number;
                sector.style.transform = `rotate(${index * anglePerSector}deg)`;
                
                // Определяем цвет сектора
                if (number === 0) {
                    sector.style.background = '#0a5f38'; // Зеленый
                } else if (rouletteData.redNumbers.includes(number)) {
                    sector.style.background = '#c00'; // Красный
                } else {
                    sector.style.background = '#000'; // Черный
                }
                
                sectorsContainer.appendChild(sector);
            });
        }

        function selectRouletteBet(type) {
            if (rouletteData.spinning) return;
            
            // Сбрасываем предыдущий выбор
            document.querySelectorAll('.bet-option').forEach(btn => {
                btn.classList.remove('active');
            });
            
            // Активируем выбранную кнопку
            event.target.classList.add('active');
            rouletteData.currentBet = type;
            document.getElementById('spinRoulette').disabled = false;
        }

        function spinRoulette() {
            if (rouletteData.spinning || !rouletteData.currentBet) return;
            
            const bet = userData.bets.roulette;
            if (userData.balance < bet) {
                showRouletteResult('Недостаточно средств!', 'lose');
                return;
            }

            userData.balance -= bet;
            updateBalance();
            rouletteData.spinning = true;
            document.getElementById('spinRoulette').disabled = true;

            const wheel = document.getElementById('rouletteWheel');
            const randomSpin = 1800 + Math.random() * 3600; // 5-10 полных оборотов
            wheel.style.transform = `rotate(${randomSpin}deg)`;

            // Определяем выигрышный номер после вращения
            setTimeout(() => {
                const totalDegrees = randomSpin % 360;
                const winningIndex = Math.floor((360 - totalDegrees) / (360 / 37));
                const winningNumber = rouletteData.numbers[winningIndex % 37];
                
                let winningType = '';
                let multiplier = 1;
                
                if (winningNumber === 0) {
                    winningType = 'green';
                    multiplier = 14;
                } else if (rouletteData.redNumbers.includes(winningNumber)) {
                    winningType = 'red';
                    multiplier = 2;
                } else {
                    winningType = 'black';
                    multiplier = 2;
                }
                
                // Проверяем дополнительные условия
                const isEven = winningNumber % 2 === 0 && winningNumber !== 0;
                const isLow = winningNumber >= 1 && winningNumber <= 18;
                const isHigh = winningNumber >= 19 && winningNumber <= 36;

                // Сохраняем в историю
                rouletteData.history.unshift({
                    number: winningNumber,
                    type: winningType,
                    even: isEven,
                    low: isLow
                });
                
                if (rouletteData.history.length > 10) {
                    rouletteData.history.pop();
                }
                
                updateRouletteHistory();

                // Проверяем выигрыш
                let won = false;
                if (rouletteData.currentBet === winningType) {
                    won = true;
                } else if (rouletteData.currentBet === 'even' && isEven) {
                    won = true;
                } else if (rouletteData.currentBet === 'odd' && !isEven && winningNumber !== 0) {
                    won = true;
                } else if (rouletteData.currentBet === 'low' && isLow) {
                    won = true;
                } else if (rouletteData.currentBet === 'high' && isHigh) {
                    won = true;
                }

                if (won) {
                    const winAmount = bet * multiplier;
                    userData.balance += winAmount;
                    showRouletteResult(`Выигрыш! Выпало ${winningNumber} (${winningType}). Вы выиграли ${winAmount} USD!`, 'win');
                    sendGameResult('roulette', true, winAmount);
                } else {
                    showRouletteResult(`Проигрыш! Выпало ${winningNumber} (${winningType})`, 'lose');
                    sendGameResult('roulette', false, 0);
                }
                
                updateBalance();
                rouletteData.spinning = false;
                
                // Через 2 секунды разрешаем снова делать ставки
                setTimeout(() => {
                    document.querySelectorAll('.bet-option').forEach(btn => {
                        btn.classList.remove('active');
                    });
                    rouletteData.currentBet = null;
                    document.getElementById('spinRoulette').disabled = false;
                }, 2000);
                
            }, 4000);
        }

        function updateRouletteHistory() {
            const historyContainer = document.getElementById('rouletteHistory');
            historyContainer.innerHTML = '';
            
            rouletteData.history.forEach(item => {
                const historyItem = document.createElement('div');
                historyItem.className = `history-item ${item.type}`;
                historyItem.textContent = item.number;
                historyContainer.appendChild(historyItem);
            });
        }

        // Игра: Кости
        function getDiceHTML() {
            return `
                <h2 style="text-align: center; margin-bottom: 20px; background: linear-gradient(90deg, #32CD32, #008000); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">🎲 Игра в кости</h2>
                <div class="bet-controls">
                    <span>Ставка: <span id="diceBet">${userData.bets.dice}</span> USD</span>
                    <div>
                        <button class="bet-btn" onclick="changeBet('dice', -5)">-5</button>
                        <button class="bet-btn" onclick="changeBet('dice', 5)">+5</button>
                    </div>
                </div>
                
                <div class="dice-container">
                    <div class="dice" id="playerDice">🎲</div>
                    <div class="dice" id="houseDice">🎲</div>
                </div>
                
                <div style="text-align: center; margin: 15px 0;">
                    <div>Ваш результат: <span id="playerScore">0</span></div>
                    <div>Результат казино: <span id="houseScore">0</span></div>
                </div>
                
                <button class="spin-btn" id="rollDiceBtn" onclick="rollDice()">🎲 Бросить кости</button>
                <div id="diceResult"></div>
            `;
        }

        function initDice() {
            diceData.rolling = false;
            diceData.playerScore = 0;
            diceData.houseScore = 0;
            updateDiceScores();
        }

        function rollDice() {
            if (diceData.rolling) return;
            
            const bet = userData.bets.dice;
            if (userData.balance < bet) {
                showDiceResult('Недостаточно средств!', 'lose');
                return;
            }

            userData.balance -= bet;
            updateBalance();
            diceData.rolling = true;
            document.getElementById('rollDiceBtn').disabled = true;

            const playerDice = document.getElementById('playerDice');
            const houseDice = document.getElementById('houseDice');
            
            // Анимация броска
            playerDice.classList.add('dice-rolling');
            houseDice.classList.add('dice-rolling');
            
            let rolls = 0;
            const rollInterval = setInterval(() => {
                playerDice.textContent = getRandomDiceFace();
                houseDice.textContent = getRandomDiceFace();
                rolls++;
                
                if (rolls > 15) {
                    clearInterval(rollInterval);
                    
                    playerDice.classList.remove('dice-rolling');
                    houseDice.classList.remove('dice-rolling');
                    
                    // Финальные результаты
                    const playerRoll = Math.floor(Math.random() * 6) + 1;
                    const houseRoll = Math.floor(Math.random() * 6) + 1;
                    
                    playerDice.textContent = getDiceFace(playerRoll);
                    houseDice.textContent = getDiceFace(houseRoll);
                    
                    diceData.playerScore = playerRoll;
                    diceData.houseScore = houseRoll;
                    updateDiceScores();
                    
                    // Определяем результат
                    let resultMessage = '';
                    let resultType = '';
                    
                    if (playerRoll > houseRoll) {
                        const winAmount = bet * 2;
                        userData.balance += winAmount;
                        resultMessage = `Победа! ${playerRoll} > ${houseRoll}. Вы выиграли ${winAmount} USD!`;
                        resultType = 'win';
                        sendGameResult('dice', true, winAmount);
                    } else if (playerRoll < houseRoll) {
                        resultMessage = `Проигрыш! ${playerRoll} < ${houseRoll}. Ставка потеряна.`;
                        resultType = 'lose';
                        sendGameResult('dice', false, 0);
                    } else {
                        userData.balance += bet; // Возвращаем ставку при ничье
                        resultMessage = `Ничья! ${playerRoll} = ${houseRoll}. Ставка возвращена.`;
                        resultType = 'draw';
                        sendGameResult('dice', false, 0);
                    }
                    
                    showDiceResult(resultMessage, resultType);
                    updateBalance();
                    
                    diceData.rolling = false;
                    document.getElementById('rollDiceBtn').disabled = false;
                }
            }, 100);
        }

        function getRandomDiceFace() {
            const diceFaces = ['⚀', '⚁', '⚂', '⚃', '⚄', '⚅'];
            return diceFaces[Math.floor(Math.random() * diceFaces.length)];
        }

        function getDiceFace(number) {
            const diceFaces = ['', '⚀', '⚁', '⚂', '⚃', '⚄', '⚅'];
            return diceFaces[number];
        }

        function updateDiceScores() {
            document.getElementById('playerScore').textContent = diceData.playerScore;
            document.getElementById('houseScore').textContent = diceData.houseScore;
        }

        function showDiceResult(message, type) {
            const resultDiv = document.getElementById('diceResult');
            resultDiv.innerHTML = `<div class="result-message ${type}">${message}</div>`;
        }

        // Заглушка для блэкджека
        function getBlackjackHTML() {
            return `
                <h2 style="text-align: center; margin-bottom: 20px; background: linear-gradient(90deg, #1E90FF, #0000FF); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">♠️ Блэкджек</h2>
                <div class="bet-controls">
                    <span>Ставка: <span id="blackjackBet">${userData.bets.blackjack}</span> USD</span>
                    <div>
                        <button class="bet-btn" onclick="changeBet('blackjack', -5)">-5</button>
                        <button class="bet-btn" onclick="changeBet('blackjack', 5)">+5</button>
                    </div>
                </div>
                <div style="text-align: center; padding: 40px; background: rgba(255,255,255,0.05); border-radius: 15px; margin: 20px 0;">
                    <p>Игра в разработке</p>
                    <p style="font-size: 3rem;">🚧</p>
                </div>
                <button class="spin-btn" onclick="closeGame()">Вернуться назад</button>
            `;
        }

        // Общие функции
        function changeBet(game, amount) {
            userData.bets[game] = Math.max(5, userData.bets[game] + amount);
            document.getElementById(game + 'Bet').textContent = userData.bets[game];
        }

        function updateBalance() {
            document.getElementById('balanceAmount').textContent = userData.balance.toFixed(2) + ' USD';
        }

        function showResult(message, type) {
            const resultDiv = document.getElementById('slotsResult');
            resultDiv.innerHTML = `<div class="result-message ${type}">${message}</div>`;
        }

        function showRouletteResult(message, type) {
            const resultDiv = document.getElementById('rouletteResult');
            resultDiv.innerHTML = `<div class="result-message ${type}">${message}</div>`;
        }

        // Функция отправки результатов в бота
        function sendGameResult(game, won, amount) {
            if (tg.sendData) {
                const gameData = {
                    game: game,
                    won: won,
                    amount: amount,
                    balance: userData.balance,
                    timestamp: Date.now()
                };
                tg.sendData(JSON.stringify(gameData));
            }
        }

        // Заглушки для инициализации игр
        function initSlots() {}
        function initRoulette() {}
        function initBlackjack() {}
        function initDice() {}
    </script>
</body>
</html>
