<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Casino Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: white;
            min-height: 100vh;
            padding: 15px;
        }

        .container {
            max-width: 400px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
            padding: 15px;
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
        }

        .balance-card {
            background: linear-gradient(45deg, #667eea, #764ba2);
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 15px;
        }

        .tabs {
            display: flex;
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            margin-bottom: 15px;
            overflow: hidden;
        }

        .tab {
            flex: 1;
            padding: 10px;
            text-align: center;
            cursor: pointer;
        }

        .tab.active {
            background: #667eea;
        }

        .game-content {
            display: none;
        }

        .game-content.active {
            display: block;
        }

        .game-area {
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .bet-buttons {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin: 15px 0;
        }

        .bet-btn {
            padding: 10px;
            border: none;
            border-radius: 5px;
            background: rgba(255,255,255,0.1);
            color: white;
            cursor: pointer;
        }

        .bet-btn.active {
            background: #667eea;
        }

        .action-btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 5px;
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            cursor: pointer;
            margin: 10px 0;
        }

        .slots-container {
            display: flex;
            justify-content: space-around;
            margin: 15px 0;
            font-size: 40px;
        }

        .slot {
            width: 60px;
            height: 60px;
            background: rgba(255,255,255,0.1);
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .result {
            background: rgba(255,255,255,0.1);
            padding: 10px;
            border-radius: 5px;
            text-align: center;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎰 Казино</h1>
        </div>

        <div class="balance-card">
            <h2>💰 Баланс: <span id="balance">1000</span> монет</h2>
        </div>

        <div class="tabs">
            <div class="tab active" onclick="switchTab('slots')">🎰 Слоты</div>
            <div class="tab" onclick="switchTab('roulette')">🎡 Рулетка</div>
            <div class="tab" onclick="switchTab('blackjack')">♠️ Блэкджек</div>
            <div class="tab" onclick="switchTab('guess')">🔢 Угадай</div>
        </div>

        <!-- Слоты -->
        <div id="slots" class="game-content active">
            <div class="game-area">
                <h3>🎰 Игровые автоматы</h3>
                <p>Ставка: <span id="slotsBet">10</span> монет</p>
                
                <div class="bet-buttons">
                    <button class="bet-btn active" onclick="setBet(10)">10</button>
                    <button class="bet-btn" onclick="setBet(50)">50</button>
                    <button class="bet-btn" onclick="setBet(100)">100</button>
                </div>

                <div class="slots-container">
                    <div class="slot" id="slot1">🍒</div>
                    <div class="slot" id="slot2">🍒</div>
                    <div class="slot" id="slot3">🍒</div>
                </div>

                <button class="action-btn" onclick="spinSlots()">🎰 Крутить</button>
                <div class="result" id="slotsResult"></div>
            </div>
        </div>

        <!-- Рулетка -->
        <div id="roulette" class="game-content">
            <div class="game-area">
                <h3>🎡 Рулетка</h3>
                <p>Ставка: <span id="rouletteBet">10</span> монет</p>
                
                <div class="bet-buttons">
                    <button class="bet-btn active" onclick="setRouletteBet(10)">10</button>
                    <button class="bet-btn" onclick="setRouletteBet(50)">50</button>
                    <button class="bet-btn" onclick="setRouletteBet(100)">100</button>
                </div>

                <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; margin: 10px 0;">
                    <button class="bet-btn" onclick="placeRouletteBet('red')">🔴 Красное</button>
                    <button class="bet-btn" onclick="placeRouletteBet('black')">⚫ Черное</button>
                    <button class="bet-btn" onclick="placeRouletteBet('green')">🟢 Зеро</button>
                </div>

                <button class="action-btn" onclick="spinRoulette()">🎡 Крутить</button>
                <div class="result" id="rouletteResult"></div>
            </div>
        </div>

        <!-- Блэкджек -->
        <div id="blackjack" class="game-content">
            <div class="game-area">
                <h3>♠️ Блэкджек</h3>
                <p>Ставка: <span id="blackjackBet">20</span> монет</p>
                
                <div class="bet-buttons">
                    <button class="bet-btn active" onclick="setBlackjackBet(20)">20</button>
                    <button class="bet-btn" onclick="setBlackjackBet(50)">50</button>
                    <button class="bet-btn" onclick="setBlackjackBet(100)">100</button>
                </div>

                <div id="blackjackArea">
                    <p>Нажмите "Начать игру" чтобы играть</p>
                </div>

                <button class="action-btn" onclick="startBlackjack()">🎲 Начать игру</button>
                <div class="result" id="blackjackResult"></div>
            </div>
        </div>

        <!-- Угадай число -->
        <div id="guess" class="game-content">
            <div class="game-area">
                <h3>🔢 Угадай число</h3>
                <p>Ставка: <span id="guessBet">10</span> монет</p>
                
                <div class="bet-buttons">
                    <button class="bet-btn active" onclick="setGuessBet(10)">10</button>
                    <button class="bet-btn" onclick="setGuessBet(50)">50</button>
                    <button class="bet-btn" onclick="setGuessBet(100)">100</button>
                </div>

                <div style="display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; margin: 10px 0;">
                    <!-- Numbers will be generated by JS -->
                </div>

                <div class="result" id="guessResult"></div>
            </div>
        </div>
    </div>

    <script>
        // Простая инициализация
        let tg = window.Telegram.WebApp;
        tg.expand();
        
        let balance = 1000;
        let currentBet = 10;
        let currentGame = 'slots';

        // Инициализация при загрузке
        document.addEventListener('DOMContentLoaded', function() {
            updateBalance();
            generateGuessNumbers();
        });

        function switchTab(tabName) {
            // Скрыть все вкладки
            document.querySelectorAll('.game-content').forEach(tab => {
                tab.classList.remove('active');
            });
            document.querySelectorAll('.tab').forEach(tab => {
                tab.classList.remove('active');
            });
            
            // Показать выбранную вкладку
            document.getElementById(tabName).classList.add('active');
            event.target.classList.add('active');
            currentGame = tabName;
        }

        function setBet(amount) {
            currentBet = amount;
            updateActiveBetButtons('slots', amount);
            document.getElementById('slotsBet').textContent = amount;
        }

        function setRouletteBet(amount) {
            currentBet = amount;
            updateActiveBetButtons('roulette', amount);
            document.getElementById('rouletteBet').textContent = amount;
        }

        function setBlackjackBet(amount) {
            currentBet = amount;
            updateActiveBetButtons('blackjack', amount);
            document.getElementById('blackjackBet').textContent = amount;
        }

        function setGuessBet(amount) {
            currentBet = amount;
            updateActiveBetButtons('guess', amount);
            document.getElementById('guessBet').textContent = amount;
        }

        function updateActiveBetButtons(game, amount) {
            const buttons = document.querySelectorAll(`#${game} .bet-btn`);
            buttons.forEach(btn => {
                btn.classList.remove('active');
                if (parseInt(btn.textContent) === amount) {
                    btn.classList.add('active');
                }
            });
        }

        function updateBalance() {
            document.getElementById('balance').textContent = balance;
        }

        function showResult(elementId, text, isWin = false) {
            const element = document.getElementById(elementId);
            element.innerHTML = text;
            element.style.display = 'block';
        }

        // ========== СЛОТЫ ==========
        function spinSlots() {
            if (balance < currentBet) {
                showResult('slotsResult', '❌ Недостаточно средств!');
                return;
            }
            
            balance -= currentBet;
            updateBalance();
            
            const symbols = ['🍒', '🍋', '🍊', '💎', '7️⃣'];
            const results = [
                symbols[Math.floor(Math.random() * symbols.length)],
                symbols[Math.floor(Math.random() * symbols.length)],
                symbols[Math.floor(Math.random() * symbols.length)]
            ];
            
            // Анимация
            let spins = 0;
            const spinInterval = setInterval(() => {
                document.getElementById('slot1').textContent = symbols[Math.floor(Math.random() * symbols.length)];
                document.getElementById('slot2').textContent = symbols[Math.floor(Math.random() * symbols.length)];
                document.getElementById('slot3').textContent = symbols[Math.floor(Math.random() * symbols.length)];
                spins++;
                
                if (spins > 10) {
                    clearInterval(spinInterval);
                    document.getElementById('slot1').textContent = results[0];
                    document.getElementById('slot2').textContent = results[1];
                    document.getElementById('slot3').textContent = results[2];
                    calculateSlotsResult(results);
                }
            }, 100);
        }

        function calculateSlotsResult(results) {
            let winAmount = 0;
            let resultText = `Результат: ${results[0]} ${results[1]} ${results[2]}<br>`;
            
            if (results[0] === results[1] && results[1] === results[2]) {
                winAmount = currentBet * 10;
                resultText += `🎉 ДЖЕКПОТ! Выигрыш: ${winAmount} монет!`;
            } else if (results[0] === results[1] || results[1] === results[2]) {
                winAmount = currentBet * 3;
                resultText += `👍 Выигрыш: ${winAmount} монет!`;
            } else {
                resultText += `💸 Проигрыш. Попробуйте еще раз!`;
            }
            
            if (winAmount > 0) {
                balance += winAmount;
                updateBalance();
                sendGameResult('slots', winAmount - currentBet);
            } else {
                sendGameResult('slots', -currentBet);
            }
            
            showResult('slotsResult', resultText, winAmount > 0);
        }

        // ========== РУЛЕТКА ==========
        function placeRouletteBet(betType) {
            // Просто запоминаем тип ставки
            window.rouletteBetType = betType;
        }

        function spinRoulette() {
            if (!window.rouletteBetType) {
                showResult('rouletteResult', '❌ Сначала выберите тип ставки!');
                return;
            }
            
            if (balance < currentBet) {
                showResult('rouletteResult', '❌ Недостаточно средств!');
                return;
            }
            
            balance -= currentBet;
            updateBalance();
            
            const winningNumber = Math.floor(Math.random() * 37);
            const isRed = winningNumber % 2 === 1 && winningNumber !== 0;
            const isBlack = winningNumber % 2 === 0 && winningNumber !== 0;
            const isGreen = winningNumber === 0;
            
            let winAmount = 0;
            let won = false;
            
            if (window.rouletteBetType === 'red' && isRed) {
                winAmount = currentBet * 2;
                won = true;
            } else if (window.rouletteBetType === 'black' && isBlack) {
                winAmount = currentBet * 2;
                won = true;
            } else if (window.rouletteBetType === 'green' && isGreen) {
                winAmount = currentBet * 35;
                won = true;
            }
            
            const resultText = `Выпало: ${winningNumber} ${isRed ? '🔴' : isBlack ? '⚫' : '🟢'}<br>`;
            
            if (won) {
                balance += winAmount;
                updateBalance();
                showResult('rouletteResult', resultText + `🎉 Выигрыш: ${winAmount} монет!`, true);
                sendGameResult('roulette', winAmount - currentBet);
            } else {
                showResult('rouletteResult', resultText + `💸 Проигрыш. Попробуйте еще раз!`);
                sendGameResult('roulette', -currentBet);
            }
            
            window.rouletteBetType = null;
        }

        // ========== БЛЭКДЖЕК ==========
        function startBlackjack() {
            if (balance < currentBet) {
                showResult('blackjackResult', '❌ Недостаточно средств!');
                return;
            }
            
            balance -= currentBet;
            updateBalance();
            
            // Простая версия блэкджека
            const playerScore = Math.floor(Math.random() * 10) + 12;
            const dealerScore = Math.floor(Math.random() * 10) + 12;
            
            let winAmount = 0;
            let resultText = `Ваши очки: ${playerScore} | Очки дилера: ${dealerScore}<br>`;
            
            if (playerScore > 21) {
                resultText += "💸 Перебор! Вы проиграли.";
            } else if (dealerScore > 21 || playerScore > dealerScore) {
                winAmount = currentBet * 2;
                resultText += `🎉 Вы выиграли! Выигрыш: ${winAmount} монет!`;
            } else if (playerScore === dealerScore) {
                winAmount = currentBet;
                resultText += "🤝 Ничья! Ставка возвращена.";
            } else {
                resultText += "💸 Вы проиграли.";
            }
            
            if (winAmount > 0) {
                balance += winAmount;
                updateBalance();
                sendGameResult('blackjack', winAmount - currentBet);
            } else {
                sendGameResult('blackjack', -currentBet);
            }
            
            showResult('blackjackResult', resultText, winAmount > 0);
        }

        // ========== УГАДАЙ ЧИСЛО ==========
        function generateGuessNumbers() {
            const container = document.querySelector('#guess div[style*="grid-template-columns"]');
            container.innerHTML = '';
            
            for (let i = 1; i <= 10; i++) {
                const btn = document.createElement('button');
                btn.className = 'bet-btn';
                btn.textContent = i;
                btn.onclick = () => makeGuess(i);
                container.appendChild(btn);
            }
        }

        function makeGuess(number) {
            if (balance < currentBet) {
                showResult('guessResult', '❌ Недостаточно средств!');
                return;
            }
            
            balance -= currentBet;
            updateBalance();
            
            const secretNumber = Math.floor(Math.random() * 10) + 1;
            let winAmount = 0;
            let resultText = `Вы выбрали: ${number}, Загадано: ${secretNumber}<br>`;
            
            if (number === secretNumber) {
                winAmount = currentBet * 5;
                resultText += `🎉 Угадали! Выигрыш: ${winAmount} монет!`;
            } else {
                resultText += `💸 Не угадали. Попробуйте еще раз!`;
            }
            
            if (winAmount > 0) {
                balance += winAmount;
                updateBalance();
                sendGameResult('guess_number', winAmount - currentBet);
            } else {
                sendGameResult('guess_number', -currentBet);
            }
            
            showResult('guessResult', resultText, winAmount > 0);
        }

        // ========== ОТПРАВКА РЕЗУЛЬТАТОВ ==========
        function sendGameResult(gameType, amount) {
            if (tg && tg.sendData) {
                const data = {
                    gameType: gameType,
                    amount: amount
                };
                tg.sendData(JSON.stringify(data));
                console.log('Data sent to bot:', data);
            } else {
                console.log('Telegram WebApp not available');
            }
        }
    </script>
</body>
</html>
