<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Casino Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background: #0f172a;
            color: white;
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
        }
        .header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .balance { color: #fbbf24; font-weight: bold; font-size: 1.2rem; }
        
        .roulette-container {
            margin: 40px 0;
            position: relative;
            width: 280px;
            height: 280px;
        }
        .wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 8px solid #334155;
            background: conic-gradient(#1e293b 0deg 18deg, #ef4444 18deg 36deg, #1e293b 36deg 54deg, #ef4444 54deg 72deg); /* Упрощенная рулетка */
            transition: transform 4s cubic-bezier(0.1, 0, 0.1, 1);
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
        }
        .pointer {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 30px;
            z-index: 10;
        }

        .bet-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            width: 100%;
        }
        .btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 15px;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn:active { transform: scale(0.95); background: #3b82f6; }
        .btn-allin { background: linear-gradient(90deg, #3b82f6, #8b5cf6); border: none; grid-column: span 2; }
    </style>
</head>
<body>
    <div class="header">
        <span>👤 Игрок</span>
        <div class="balance">💰 <span id="user-balance">1000</span></div>
    </div>

    <div class="roulette-container">
        <img src="https://cdn-icons-png.flaticon.com/512/8146/8146003.png" class="pointer">
        <div class="wheel" id="wheel"></div>
    </div>

    <div style="margin-bottom: 20px; font-size: 0.9rem; color: #94a3b8;">До начала: <span id="timer">45</span> сек</div>

    <div class="bet-buttons">
        <button class="btn" onclick="makeBet(10)">10</button>
        <button class="btn" onclick="makeBet(50)">50</button>
        <button class="btn" onclick="makeBet(100)">100</button>
        <button class="btn btn-allin" onclick="makeBet('all')">ПОСТАВИТЬ ВСЁ</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        function makeBet(amount) {
            tg.HapticFeedback.impactOccurred('medium');
            // Здесь будет логика отправки ставки на твой сервер
            alert("Ставка принята: " + amount);
        }

        // Демо-вращение
        setInterval(() => {
            const wheel = document.getElementById('wheel');
            const randomDeg = Math.floor(Math.random() * 3600) + 360;
            wheel.style.transform = `rotate(${randomDeg}deg)`;
        }, 60000);
    </script>
</body>
</html>
