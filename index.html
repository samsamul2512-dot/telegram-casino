<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PvP Roulette</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0c0c0c 0%, #1a1a1a 100%);
            color: white;
            min-height: 100vh;
            padding-bottom: 80px; /* Место для нижнего меню */
        }

        .container {
            max-width: 400px;
            margin: 0 auto;
            padding: 10px;
        }

        .tournament-header {
            background: linear-gradient(135deg, #ff6b35 0%, #f7931e 100%);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 10px;
            text-align: center;
        }

        .player-list {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            margin-bottom: 10px;
            padding: 10px;
        }

        .player-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .player-item:last-child {
            border-bottom: none;
        }

        .player-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .player-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .player-stats {
            text-align: right;
        }

        .player-bet {
            color: #f7931e;
            font-weight: bold;
            font-size: 1.1em;
        }

        .player-chance {
            color: #00ff88;
            font-size: 0.9em;
        }

        .top-player {
            background: rgba(247, 147, 30, 0.2);
            border-radius: 8px;
            border-left: 3px solid #f7931e;
        }

        .prize-pool {
            background: rgba(0, 255, 136, 0.1);
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 10px;
        }

        .prize-amount {
            font-size: 1.5em;
            font-weight: bold;
            color: #00ff88;
            margin: 5px 0;
        }

        .timer-section {
            background: rgba(255, 107, 53, 0.1);
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 10px;
        }

        .timer {
            font-size: 2em;
            font-weight: bold;
            color: #ff6b35;
        }

        /* Рулетка */
        .roulette-container {
            position: relative;
            margin: 15px 0;
        }

        .roulette-wheel {
            width: 250px;
            height: 250px;
            margin: 0 auto;
            border: 5px solid #f7931e;
            border-radius: 50%;
            position: relative;
            background: conic-gradient(
                from 0deg,
                #ff6b35 0deg 120deg,
                #00ff88 120deg 240deg,
                #667eea 240deg 360deg
            );
            box-shadow: 0 0 30px rgba(247, 147, 30, 0.5);
        }

        .roulette-pointer {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-top: 20px solid #ff6b35;
            z-index: 10;
        }

        .betting-controls {
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 10px;
        }

        .bet-amount {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .bet-input {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: white;
            padding: 10px;
            border-radius: 5px;
            width: 100px;
            text-align: center;
        }

        .bet-buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 5px;
            margin-bottom: 15px;
        }

        .quick-bet {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: white;
            padding: 8px;
            border-radius: 5px;
            cursor: pointer;
        }

        .place-bet-btn {
            background: linear-gradient(135deg, #ff6b35 0%, #f7931e 100%);
            border: none;
            color: white;
            padding: 15px;
            border-radius: 25px;
            font-size: 1.1em;
            cursor: pointer;
            width: 100%;
        }

        /* Нижнее меню */
        .bottom-menu {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px);
            padding: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .menu-buttons {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 5px;
            max-width: 400px;
            margin: 0 auto;
        }

        .menu-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: white;
            padding: 10px 5px;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            font-size: 0.8em;
        }

        .menu-btn.active {
            background: linear-gradient(135deg, #ff6b35 0%, #f7931e 100%);
        }

        /* Результаты */
        .results {
            background: rgba(0, 255, 136, 0.1);
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
            display: none;
        }

        .winner-info {
            text-align: center;
            font-size: 1.2em;
            margin: 10px 0;
        }

        .winner-prize {
            color: #00ff88;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="tournament-header">
            <h2>🎯 Соло Турнир</h2>
            <p>PvP Рулетка • Призовой фонд</p>
        </div>

        <div class="player-list" id="playerList">
            <!-- Игроки будут здесь -->
        </div>

        <div class="prize-pool">
            <div>Призовой фонд</div>
            <div class="prize-amount" id="totalPot">0 TON</div>
            <div>2 победителя • Комиссия казино: 5%</div>
        </div>

        <div class="timer-section">
            <div>Старт через</div>
            <div class="timer" id="timer">00:25</div>
            <div>Следующий раунд</div>
        </div>

        <div class="roulette-container">
            <div class="roulette-pointer"></div>
            <div class="roulette-wheel" id="rouletteWheel"></div>
        </div>

        <div class="betting-controls">
            <div class="bet-amount">
                <span>Ваша ставка:</span>
                <input type="number" class="bet-input" id="betAmount" value="10" min="1">
                <span>TON</span>
            </div>

            <div class="bet-buttons">
                <button class="quick-bet" onclick="setBet(5)">5 TON</button>
                <button class="quick-bet" onclick="setBet(10)">10 TON</button>
                <button class="quick-bet" onclick="setBet(25)">25 TON</button>
                <button class="quick-bet" onclick="setBet(50)">50 TON</button>
                <button class="quick-bet" onclick="setBet(100)">100 TON</button>
                <button class="quick-bet" onclick="setBet(250)">250 TON</button>
                <button class="quick-bet" onclick="setBet(500)">500 TON</button>
                <button class="quick-bet" onclick="setBet(1000)">1000 TON</button>
            </div>

            <button class="place-bet-btn" onclick="placeBet()">🎯 Сделать ставку</button>
        </div>

        <div class="results" id="results">
            <h3>🎉 Победитель раунда!</h3>
            <div class="winner-info" id="winnerInfo"></div>
            <div>Выигрыш: <span class="winner-prize" id="winnerPrize">0 TON</span></div>
            <div>Комиссия казино: <span id="casinoCommission">0 TON</span></div>
        </div>
    </div>

    <!-- Нижнее меню -->
    <div class="bottom-menu">
        <div class="menu-buttons">
            <button class="menu-btn active">ПвП</button>
            <button class="menu-btn">Соло</button>
            <button class="menu-btn">Инвентарь</button>
            <button class="menu-btn">Магазин</button>
            <button class="menu-btn">Заработок</button>
        </div>
    </div>

    <script>
        // Telegram WebApp API
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Данные игры
        const gameState = {
            balance: 1000,
            currentBet: 10,
            players: [],
            totalPot: 0,
            roundTime: 25,
            timer: null,
            isBettingPhase: true,
            casinoCommission: 0.05 // 5% комиссия
        };

        // Инициализация
        document.addEventListener('DOMContentLoaded', function() {
            updateBalanceDisplay();
            simulateOtherPlayers();
            startRoundTimer();
            updatePlayerList();
        });

        // Установка ставки
        function setBet(amount) {
            gameState.currentBet = amount;
            document.getElementById('betAmount').value = amount;
        }

        // Размещение ставки
        function placeBet() {
            if (!gameState.isBettingPhase) {
                alert('Ставки в этом раунде закрыты!');
                return;
            }

            if (gameState.currentBet > gameState.balance) {
                alert('Недостаточно средств!');
                return;
            }

            // Добавляем игрока (или обновляем существующего)
            const existingPlayerIndex = gameState.players.findIndex(p => p.id === 'you');
            if (existingPlayerIndex !== -1) {
                gameState.players[existingPlayerIndex].bet += gameState.currentBet;
            } else {
                gameState.players.push({
                    id: 'you',
                    name: 'Вы',
                    bet: gameState.currentBet,
                    chance: 0
                });
            }

            gameState.balance -= gameState.currentBet;
            updateBalanceDisplay();
            updateChances();
            updatePlayerList();

            // Отправляем данные в бота
            sendBetToBot();
        }

        // Расчет шансов на основе ставок
        function updateChances() {
            const totalBets = gameState.players.reduce((sum, player) => sum + player.bet, 0);
            gameState.totalPot = totalBets;
            
            gameState.players.forEach(player => {
                player.chance = (player.bet / totalBets) * 100;
            });

            document.getElementById('totalPot').textContent = totalBets.toFixed(2) + ' TON';
        }

        // Обновление списка игроков
        function updatePlayerList() {
            const container = document.getElementById('playerList');
            container.innerHTML = '';

            // Сортируем игроков по размеру ставки
            const sortedPlayers = [...gameState.players].sort((a, b) => b.bet - a.bet);

            sortedPlayers.forEach((player, index) => {
                const playerElement = document.createElement('div');
                playerElement.className = `player-item ${index === 0 ? 'top-player' : ''}`;
                
                playerElement.innerHTML = `
                    <div class="player-info">
                        <div class="player-avatar">${player.name.charAt(0)}</div>
                        <div>
                            <div>${player.name}</div>
                            ${index === 0 ? '<div style="color: #f7931e; font-size: 0.8em;">ТОП ИГРОК</div>' : ''}
                        </div>
                    </div>
                    <div class="player-stats">
                        <div class="player-bet">+${player.bet} TON</div>
                        <div class="player-chance">ШАНС ${player.chance.toFixed(0)}%</div>
                    </div>
                `;

                container.appendChild(playerElement);
            });
        }

        // Таймер раунда
        function startRoundTimer() {
            let timeLeft = gameState.roundTime;
            gameState.timer = setInterval(() => {
                document.getElementById('timer').textContent = 
                    `00:${timeLeft.toString().padStart(2, '0')}`;
                
                if (timeLeft <= 0) {
                    clearInterval(gameState.timer);
                    endBettingPhase();
                }
                
                timeLeft--;
            }, 1000);
        }

        function endBettingPhase() {
            gameState.isBettingPhase = false;
            
            if (gameState.players.length < 2) {
                // Если игроков меньше 2, возвращаем ставку и начинаем новый раунд
                if (gameState.players.length === 1) {
                    gameState.balance += gameState.players[0].bet;
                    updateBalanceDisplay();
                }
                alert('Недостаточно игроков! Ставки возвращены.');
                startNewRound();
                return;
            }

            document.getElementById('timer').textContent = 'Крутим...';
            spinRoulette();
        }

        // Вращение рулетки с учетом шансов
        function spinRoulette() {
            const wheel = document.getElementById('rouletteWheel');
            
            // Создаем взвешенный массив для выбора победителя
            let weightedArray = [];
            gameState.players.forEach((player, index) => {
                // Количество записей = шанс игрока (например, 39% = 39 записей)
                const entries = Math.max(1, Math.floor(player.chance));
                for (let i = 0; i < entries; i++) {
                    weightedArray.push(index);
                }
            });

            // Случайный выбор победителя с учетом весов
            const randomIndex = weightedArray[Math.floor(Math.random() * weightedArray.length)];
            const winner = gameState.players[randomIndex];

            // Анимация вращения (упрощенная)
            wheel.style.transition = 'transform 3s cubic-bezier(0.1, 0.8, 0.2, 1)';
            const spins = 5 + (randomIndex / gameState.players.length) * 2;
            wheel.style.transform = `rotate(${spins * 360}deg)`;

            // Показ результатов
            setTimeout(() => {
                showResults(winner);
            }, 3500);
        }

        // Показ результатов
        function showResults(winner) {
            const commission = gameState.totalPot * gameState.casinoCommission;
            const winnerPrize = gameState.totalPot - commission;

            document.getElementById('results').style.display = 'block';
            document.getElementById('winnerInfo').textContent = `${winner.name} побеждает!`;
            document.getElementById('winnerPrize').textContent = winnerPrize.toFixed(2) + ' TON';
            document.getElementById('casinoCommission').textContent = commission.toFixed(2) + ' TON';

            // Начисляем выигрыш если победил текущий игрок
            if (winner.id === 'you') {
                gameState.balance += winnerPrize;
                updateBalanceDisplay();
                
                // Отправляем данные о выигрыше в бота
                sendWinToBot(winnerPrize, commission);
            }

            // Новый раунд через 8 секунд
            setTimeout(() => {
                startNewRound();
            }, 8000);
        }

        function startNewRound() {
            gameState.isBettingPhase = true;
            gameState.players = [];
            gameState.totalPot = 0;
            document.getElementById('results').style.display = 'none';
            document.getElementById('rouletteWheel').style.transform = 'rotate(0deg)';
            document.getElementById('totalPot').textContent = '0 TON';
            updatePlayerList();
            startRoundTimer();
        }

        // Симуляция других игроков
        function simulateOtherPlayers() {
            setInterval(() => {
                if (gameState.isBettingPhase && Math.random() > 0.5) {
                    const names = ['vbetone', 'Gasa', 'CryptoKing', 'TonWhale', 'RoulettePro'];
                    const bets = [17, 50, 25, 100, 75, 200];
                    
                    const newPlayer = {
                        id: 'bot_' + Date.now(),
                        name: names[Math.floor(Math.random() * names.length)],
                        bet: bets[Math.floor(Math.random() * bets.length)],
                        chance: 0
                    };

                    gameState.players.push(newPlayer);
                    updateChances();
                    updatePlayerList();
                }
            }, 3000);
        }

        function updateBalanceDisplay() {
            // В реальном приложении здесь будет обновление баланса из бота
        }

        function sendBetToBot() {
            if (tg && tg.sendData) {
                const betData = {
                    type: 'pvp_bet',
                    bet: gameState.currentBet,
                    timestamp: Date.now()
                };
                tg.sendData(JSON.stringify(betData));
            }
        }

        function sendWinToBot(prize, commission) {
            if (tg && tg.sendData) {
                const winData = {
                    type: 'pvp_win',
                    prize: prize,
                    commission: commission,
                    timestamp: Date.now()
                };
                tg.sendData(JSON.stringify(winData));
            }
        }

        // Обработка данных от бота
        if (tg && tg.onEvent) {
            tg.onEvent('webAppDataReceived', (data) => {
                const gameData = JSON.parse(data);
                if (gameData.type === 'balance_update') {
                    gameState.balance = gameData.balance;
                    updateBalanceDisplay();
                }
            });
        }
    </script>
</body>
</html>
