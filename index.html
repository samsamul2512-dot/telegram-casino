<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Casino</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: white;
            min-height: 100vh;
        }

        .container {
            max-width: 400px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }

        .balance-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            text-align: center;
        }

        .balance-amount {
            font-size: 2em;
            font-weight: bold;
            margin: 10px 0;
        }

        .games-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .game-card {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .game-card:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.2);
        }

        .game-icon {
            font-size: 3em;
            margin-bottom: 10px;
        }

        .game-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 1000;
        }

        .modal-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #1a1a2e;
            padding: 20px;
            border-radius: 15px;
            width: 90%;
            max-width: 400px;
        }

        .close-modal {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 1.5em;
            cursor: pointer;
        }

        .bet-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 20px 0;
        }

        .bet-btn {
            background: #667eea;
            border: none;
            color: white;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
        }

        .spin-btn {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            border: none;
            color: white;
            padding: 15px 30px;
            font-size: 1.2em;
            border-radius: 25px;
            cursor: pointer;
            width: 100%;
            margin-top: 20px;
        }

        .slots-container {
            display: flex;
            justify-content: space-around;
            margin: 20px 0;
        }

        .slot {
            width: 80px;
            height: 80px;
            background: white;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2em;
            color: #333;
        }

        .roulette-wheel {
            width: 200px;
            height: 200px;
            margin: 20px auto;
            border: 5px solid #fff;
            border-radius: 50%;
            position: relative;
            overflow: hidden;
        }

        .roulette-ball {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 20px;
            height: 20px;
            background: gold;
            border-radius: 50%;
            z-index: 10;
        }

        .blackjack-table {
            background: #0a5f38;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
        }

        .hand {
            display: flex;
            gap: 10px;
            margin: 10px 0;
            min-height: 80px;
        }

        .card {
            width: 60px;
            height: 80px;
            background: white;
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: black;
            font-weight: bold;
        }

        .game-controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 20px;
        }

        .control-btn {
            padding: 10px;
            border: none;
            border-radius: 5px;
            color: white;
            cursor: pointer;
        }

        .hit { background: #4CAF50; }
        .stand { background: #f44336; }
        .double { background: #2196F3; }
        .split { background: #FF9800; }

        .result-message {
            text-align: center;
            font-size: 1.2em;
            margin: 20px 0;
            padding: 10px;
            border-radius: 5px;
        }

        .win { background: rgba(76, 175, 80, 0.3); }
        .lose { background: rgba(244, 67, 54, 0.3); }
    </style>
</head>
<body>
    <div class="container">
        <!-- Главный экран -->
        <div id="mainScreen">
            <div class="header">
                <h1>🎰 Crypto Casino</h1>
                <p>Ваш путь к большим выигрышам!</p>
            </div>

            <div class="balance-card">
                <div>Ваш баланс</div>
                <div class="balance-amount" id="balanceAmount">1000 USD</div>
                <div>ID: <span id="userId">123456</span></div>
            </div>

            <div class="games-grid">
                <div class="game-card" onclick="openGame('slots')">
                    <div class="game-icon">🎰</div>
                    <div>Слоты</div>
                </div>
                <div class="game-card" onclick="openGame('roulette')">
                    <div class="game-icon">🎡</div>
                    <div>Рулетка</div>
                </div>
                <div class="game-card" onclick="openGame('blackjack')">
                    <div class="game-icon">♠️</div>
                    <div>Блэкджек</div>
                </div>
                <div class="game-card" onclick="openGame('poker')">
                    <div class="game-icon">🃏</div>
                    <div>Покер</div>
                </div>
            </div>

            <button class="spin-btn" onclick="refreshBalance()">🔄 Обновить баланс</button>
        </div>

        <!-- Модальное окно для игр -->
        <div id="gameModal" class="game-modal">
            <div class="modal-content">
                <span class="close-modal" onclick="closeGame()">×</span>
                <div id="gameContent"></div>
            </div>
        </div>
    </div>

    <script>
        // Telegram WebApp API
        const tg = window.Telegram.WebApp;
        
        // Инициализация
        tg.expand();
        tg.BackButton.hide();

        // Данные пользователя
        let userData = {
            balance: 1000,
            userId: tg.initDataUnsafe?.user?.id || '123456',
            bets: {
                slots: 10,
                roulette: 50,
                blackjack: 25
            }
        };

        // Инициализация баланса
        document.getElementById('balanceAmount').textContent = userData.balance + ' USD';
        document.getElementById('userId').textContent = userData.userId;

        // Функции для игр
        function openGame(gameType) {
            const modal = document.getElementById('gameModal');
            const gameContent = document.getElementById('gameContent');
            
            switch(gameType) {
                case 'slots':
                    gameContent.innerHTML = getSlotsHTML();
                    initSlots();
                    break;
                case 'roulette':
                    gameContent.innerHTML = getRouletteHTML();
                    initRoulette();
                    break;
                case 'blackjack':
                    gameContent.innerHTML = getBlackjackHTML();
                    initBlackjack();
                    break;
                case 'poker':
                    gameContent.innerHTML = '<h2>Покер - скоро будет доступен!</h2>';
                    break;
            }
            
            modal.style.display = 'block';
            tg.BackButton.show();
            tg.BackButton.onClick(closeGame);
        }

        function closeGame() {
            document.getElementById('gameModal').style.display = 'none';
            tg.BackButton.hide();
        }

        function refreshBalance() {
            // Симуляция обновления баланса из бота
            tg.showPopup({
                title: 'Обновление баланса',
                message: 'Запрашиваем актуальный баланс...',
                buttons: [{ type: 'ok' }]
            });

            // В реальности здесь будет запрос к боту
            setTimeout(() => {
                userData.balance += Math.random() * 100 - 50;
                document.getElementById('balanceAmount').textContent = userData.balance.toFixed(2) + ' USD';
            }, 1000);
        }

        // Игра: Слоты
        function getSlotsHTML() {
            return `
                <h2>🎰 Игровые автоматы</h2>
                <div class="bet-controls">
                    <span>Ставка: <span id="slotsBet">${userData.bets.slots}</span> USD</span>
                    <div>
                        <button class="bet-btn" onclick="changeBet('slots', -5)">-5</button>
                        <button class="bet-btn" onclick="changeBet('slots', 5)">+5</button>
                    </div>
                </div>
                <div class="slots-container">
                    <div class="slot" id="slot1">🍒</div>
                    <div class="slot" id="slot2">🍋</div>
                    <div class="slot" id="slot3">🍊</div>
                </div>
                <button class="spin-btn" onclick="spinSlots()">🎰 Крутить!</button>
                <div id="slotsResult"></div>
            `;
        }

        function initSlots() {
            // Инициализация слотов
        }

        function spinSlots() {
            const bet = userData.bets.slots;
            if (userData.balance < bet) {
                showResult('Недостаточно средств!', 'lose');
                return;
            }

            userData.balance -= bet;
            updateBalance();

            const symbols = ['🍒', '🍋', '🍊', '⭐', '🔔', '💎'];
            const slots = ['slot1', 'slot2', 'slot3'];
            
            // Анимация вращения
            let spins = 0;
            const spinInterval = setInterval(() => {
                slots.forEach(slotId => {
                    const randomSymbol = symbols[Math.floor(Math.random() * symbols.length)];
                    document.getElementById(slotId).textContent = randomSymbol;
                });
                spins++;
                
                if (spins > 20) {
                    clearInterval(spinInterval);
                    // Финальный результат
                    const results = [
                        symbols[Math.floor(Math.random() * symbols.length)],
                        symbols[Math.floor(Math.random() * symbols.length)],
                        symbols[Math.floor(Math.random() * symbols.length)]
                    ];
                    
                    slots.forEach((slotId, index) => {
                        document.getElementById(slotId).textContent = results[index];
                    });

                    // Проверка выигрыша
                    if (results[0] === results[1] && results[1] === results[2]) {
                        const winAmount = bet * 10;
                        userData.balance += winAmount;
                        showResult(`ДЖЕКПОТ! Вы выиграли ${winAmount} USD!`, 'win');
                        sendGameResult('slots', true, winAmount);
                    } else if (results[0] === results[1] || results[1] === results[2]) {
                        const winAmount = bet * 2;
                        userData.balance += winAmount;
                        showResult(`Вы выиграли ${winAmount} USD!`, 'win');
                        sendGameResult('slots', true, winAmount);
                    } else {
                        showResult('Повезет в следующий раз!', 'lose');
                        sendGameResult('slots', false, 0);
                    }
                    updateBalance();
                }
            }, 100);
        }

        // Игра: Рулетка
        function getRouletteHTML() {
            return `
                <h2>🎡 Европейская рулетка</h2>
                <div class="bet-controls">
                    <span>Ставка: <span id="rouletteBet">${userData.bets.roulette}</span> USD</span>
                    <div>
                        <button class="bet-btn" onclick="changeBet('roulette', -10)">-10</button>
                        <button class="bet-btn" onclick="changeBet('roulette', 10)">+10</button>
                    </div>
                </div>
                <div class="roulette-wheel" id="rouletteWheel">
                    <div class="roulette-ball"></div>
                </div>
                <div style="text-align: center; margin: 20px 0;">
                    <button class="bet-btn" onclick="placeRouletteBet('red')">🔴 Красное</button>
                    <button class="bet-btn" onclick="placeRouletteBet('black')">⚫ Черное</button>
                    <button class="bet-btn" onclick="placeRouletteBet('green')">🟢 Зеленое</button>
                </div>
                <div id="rouletteResult"></div>
            `;
        }

        function placeRouletteBet(type) {
            const bet = userData.bets.roulette;
            if (userData.balance < bet) {
                showRouletteResult('Недостаточно средств!', 'lose');
                return;
            }

            userData.balance -= bet;
            updateBalance();

            // Анимация рулетки
            const wheel = document.getElementById('rouletteWheel');
            wheel.style.transition = 'transform 4s cubic-bezier(0.1, 0.8, 0.2, 1)';
            const randomSpin = 1800 + Math.random() * 3600;
            wheel.style.transform = `rotate(${randomSpin}deg)`;

            setTimeout(() => {
                const resultDegrees = randomSpin % 360;
                let result;
                if (resultDegrees < 120) result = 'red';
                else if (resultDegrees < 240) result = 'black';
                else result = 'green';

                if (result === type) {
                    let multiplier = 2;
                    if (type === 'green') multiplier = 14;
                    const winAmount = bet * multiplier;
                    userData.balance += winAmount;
                    showRouletteResult(`Выигрыш! ${winAmount} USD`, 'win');
                    sendGameResult('roulette', true, winAmount);
                } else {
                    showRouletteResult('Проигрыш', 'lose');
                    sendGameResult('roulette', false, 0);
                }
                updateBalance();
            }, 4000);
        }

        // Игра: Блэкджек
        function getBlackjackHTML() {
            return `
                <h2>♠️ Блэкджек</h2>
                <div class="bet-controls">
                    <span>Ставка: <span id="blackjackBet">${userData.bets.blackjack}</span> USD</span>
                    <div>
                        <button class="bet-btn" onclick="changeBet('blackjack', -5)">-5</button>
                        <button class="bet-btn" onclick="changeBet('blackjack', 5)">+5</button>
                    </div>
                </div>
                
                <div class="blackjack-table">
                    <h3>Диллер</h3>
                    <div class="hand" id="dealerHand"></div>
                    
                    <h3>Игрок</h3>
                    <div class="hand" id="playerHand"></div>
                    
                    <div class="game-controls" id="blackjackControls">
                        <button class="control-btn hit" onclick="blackjackHit()">Взять</button>
                        <button class="control-btn stand" onclick="blackjackStand()">Пас</button>
                        <button class="control-btn double" onclick="blackjackDouble()">Удвоить</button>
                    </div>
                </div>
                <div id="blackjackResult"></div>
            `;
        }

        // Общие функции
        function changeBet(game, amount) {
            userData.bets[game] = Math.max(5, userData.bets[game] + amount);
            document.getElementById(game + 'Bet').textContent = userData.bets[game];
        }

        function updateBalance() {
            document.getElementById('balanceAmount').textContent = userData.balance.toFixed(2) + ' USD';
        }

        function showResult(message, type) {
            const resultDiv = document.getElementById('slotsResult');
            resultDiv.innerHTML = `<div class="result-message ${type}">${message}</div>`;
        }

        function showRouletteResult(message, type) {
            const resultDiv = document.getElementById('rouletteResult');
            resultDiv.innerHTML = `<div class="result-message ${type}">${message}</div>`;
        }

        // Функция отправки результатов в бота
        function sendGameResult(game, won, amount) {
            if (tg && tg.sendData) {
                const gameData = {
                    game: game,
                    won: won,
                    amount: amount,
                    balance: userData.balance,
                    timestamp: Date.now()
                };
                tg.sendData(JSON.stringify(gameData));
            }
        }

        // Блэкджек логика (упрощенная версия)
        let blackjackGame = {
            deck: [],
            playerHand: [],
            dealerHand: [],
            gameActive: false
        };

        function initBlackjack() {
            // Инициализация игры в блэкджек
        }

        function blackjackHit() {
            // Логика взятия карты
        }

        function blackjackStand() {
            // Логика паса
        }

        function blackjackDouble() {
            // Логика удвоения
        }
    </script>
</body>
</html>
