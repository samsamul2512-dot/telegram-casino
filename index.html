<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Casino</title>
    <style>
        /* ... (остальные стили остаются без изменений) ... */

        .roulette-wheel {
            width: 200px;
            height: 200px;
            margin: 20px auto;
            border: 5px solid #fff;
            border-radius: 50%;
            position: relative;
            overflow: hidden;
            transition: transform 4s cubic-bezier(0.1, 0.8, 0.2, 1);
            background: conic-gradient(
                #0a5f38 0deg 10deg,
                #000 10deg 20deg,
                #c00 20deg 30deg,
                #000 30deg 40deg,
                #c00 40deg 50deg,
                #000 50deg 60deg,
                #c00 60deg 70deg,
                #000 70deg 80deg,
                #c00 80deg 90deg,
                #000 90deg 100deg,
                #c00 100deg 110deg,
                #000 110deg 120deg,
                #c00 120deg 130deg,
                #000 130deg 140deg,
                #c00 140deg 150deg,
                #000 150deg 160deg,
                #c00 160deg 170deg,
                #000 170deg 180deg,
                #c00 180deg 190deg,
                #000 190deg 200deg,
                #c00 200deg 210deg,
                #000 210deg 220deg,
                #c00 220deg 230deg,
                #000 230deg 240deg,
                #c00 240deg 250deg,
                #000 250deg 260deg,
                #c00 260deg 270deg,
                #000 270deg 280deg,
                #c00 280deg 290deg,
                #000 290deg 300deg,
                #c00 300deg 310deg,
                #000 310deg 320deg,
                #c00 320deg 330deg,
                #000 330deg 340deg,
                #c00 340deg 350deg,
                #000 350deg 360deg
            );
        }

        .roulette-ball {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 15px;
            height: 15px;
            background: gold;
            border-radius: 50%;
            z-index: 10;
            box-shadow: 0 0 5px yellow;
        }

        .roulette-marker {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 2px;
            height: 20px;
            background: white;
            z-index: 5;
        }

        .roulette-numbers {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 50%;
        }

        .roulette-number {
            position: absolute;
            width: 30px;
            height: 30px;
            background: #0a5f38;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
            color: white;
            transform-origin: center 100px;
        }

        .bet-options {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            margin: 20px 0;
        }

        .bet-option {
            padding: 15px 10px;
            border: none;
            border-radius: 10px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            transition: all 0.3s ease;
        }

        .bet-option.red { background: #c00; }
        .bet-option.black { background: #000; }
        .bet-option.green { background: #0a5f38; }
        .bet-option.even { background: #2196F3; }
        .bet-option.odd { background: #FF9800; }
        .bet-option.low { background: #9C27B0; }
        .bet-option.high { background: #607D8B; }

        .bet-option.active {
            transform: scale(1.05);
            box-shadow: 0 0 10px gold;
        }

        .roulette-history {
            display: flex;
            gap: 5px;
            margin: 10px 0;
            justify-content: center;
            flex-wrap: wrap;
        }

        .history-item {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: bold;
            color: white;
        }

        .history-item.red { background: #c00; }
        .history-item.black { background: #000; }
        .history-item.green { background: #0a5f38; }
    </style>
</head>
<body>
    <div class="container">
        <!-- Главный экран -->
        <div id="mainScreen">
            <div class="header">
                <h1>🎰 Crypto Casino</h1>
                <p>Ваш путь к большим выигрышам!</p>
            </div>

            <div class="balance-card">
                <div>Ваш баланс</div>
                <div class="balance-amount" id="balanceAmount">1000 USD</div>
                <div>ID: <span id="userId">123456</span></div>
            </div>

            <div class="games-grid">
                <div class="game-card" onclick="openGame('slots')">
                    <div class="game-icon">🎰</div>
                    <div>Слоты</div>
                </div>
                <div class="game-card" onclick="openGame('roulette')">
                    <div class="game-icon">🎡</div>
                    <div>Рулетка</div>
                </div>
                <div class="game-card" onclick="openGame('blackjack')">
                    <div class="game-icon">♠️</div>
                    <div>Блэкджек</div>
                </div>
                <div class="game-card" onclick="openGame('poker')">
                    <div class="game-icon">🃏</div>
                    <div>Покер</div>
                </div>
            </div>

            <button class="spin-btn" onclick="refreshBalance()">🔄 Обновить баланс</button>
        </div>

        <!-- Модальное окно для игр -->
        <div id="gameModal" class="game-modal">
            <div class="modal-content">
                <span class="close-modal" onclick="closeGame()">×</span>
                <div id="gameContent"></div>
            </div>
        </div>
    </div>

    <script>
        // Telegram WebApp API
        const tg = window.Telegram?.WebApp || {};
        
        // Инициализация
        if (tg.expand) tg.expand();
        if (tg.BackButton) tg.BackButton.hide();

        // Данные пользователя
        let userData = {
            balance: 1000,
            userId: tg.initDataUnsafe?.user?.id || '123456',
            bets: {
                slots: 10,
                roulette: 50,
                blackjack: 25,
                poker: 30
            }
        };

        // Данные для рулетки
        let rouletteData = {
            spinning: false,
            currentBet: null,
            history: [],
            numbers: [
                0, 32, 15, 19, 4, 21, 2, 25, 17, 34, 6, 27, 13, 36, 11, 30, 8, 23, 10, 5, 24, 16, 33, 1, 20, 14, 31, 9, 22, 18, 29, 7, 28, 12, 35, 3, 26
            ],
            redNumbers: [32, 19, 21, 25, 34, 27, 36, 30, 23, 5, 16, 1, 14, 9, 18, 7, 12, 3],
            blackNumbers: [15, 4, 2, 17, 6, 13, 11, 8, 10, 24, 33, 20, 31, 22, 29, 28, 35, 26]
        };

        // Инициализация баланса
        document.getElementById('balanceAmount').textContent = userData.balance + ' USD';
        document.getElementById('userId').textContent = userData.userId;

        // Функции для игр
        function openGame(gameType) {
            const modal = document.getElementById('gameModal');
            const gameContent = document.getElementById('gameContent');
            
            switch(gameType) {
                case 'slots':
                    gameContent.innerHTML = getSlotsHTML();
                    initSlots();
                    break;
                case 'roulette':
                    gameContent.innerHTML = getRouletteHTML();
                    initRoulette();
                    break;
                case 'blackjack':
                    gameContent.innerHTML = getBlackjackHTML();
                    initBlackjack();
                    break;
                case 'poker':
                    gameContent.innerHTML = getPokerHTML();
                    initPoker();
                    break;
            }
            
            modal.style.display = 'block';
            if (tg.BackButton) {
                tg.BackButton.show();
                tg.BackButton.onClick(closeGame);
            }
        }

        function closeGame() {
            document.getElementById('gameModal').style.display = 'none';
            if (tg.BackButton) tg.BackButton.hide();
        }

        function refreshBalance() {
            if (tg.showPopup) {
                tg.showPopup({
                    title: 'Обновление баланса',
                    message: 'Запрашиваем актуальный баланс...',
                    buttons: [{ type: 'ok' }]
                });
            }

            setTimeout(() => {
                userData.balance += Math.random() * 100 - 50;
                document.getElementById('balanceAmount').textContent = userData.balance.toFixed(2) + ' USD';
            }, 1000);
        }

        // Игра: Слоты (без изменений)
        function getSlotsHTML() {
            return `
                <h2>🎰 Игровые автоматы</h2>
                <div class="bet-controls">
                    <span>Ставка: <span id="slotsBet">${userData.bets.slots}</span> USD</span>
                    <div>
                        <button class="bet-btn" onclick="changeBet('slots', -5)">-5</button>
                        <button class="bet-btn" onclick="changeBet('slots', 5)">+5</button>
                    </div>
                </div>
                <div class="slots-container">
                    <div class="slot" id="slot1">🍒</div>
                    <div class="slot" id="slot2">🍋</div>
                    <div class="slot" id="slot3">🍊</div>
                </div>
                <button class="spin-btn" onclick="spinSlots()">🎰 Крутить!</button>
                <div id="slotsResult"></div>
            `;
        }

        function spinSlots() {
            const bet = userData.bets.slots;
            if (userData.balance < bet) {
                showResult('Недостаточно средств!', 'lose');
                return;
            }

            userData.balance -= bet;
            updateBalance();

            const symbols = ['🍒', '🍋', '🍊', '⭐', '🔔', '💎'];
            const slots = ['slot1', 'slot2', 'slot3'];
            
            let spins = 0;
            const spinInterval = setInterval(() => {
                slots.forEach(slotId => {
                    const randomSymbol = symbols[Math.floor(Math.random() * symbols.length)];
                    document.getElementById(slotId).textContent = randomSymbol;
                });
                spins++;
                
                if (spins > 20) {
                    clearInterval(spinInterval);
                    const results = [
                        symbols[Math.floor(Math.random() * symbols.length)],
                        symbols[Math.floor(Math.random() * symbols.length)],
                        symbols[Math.floor(Math.random() * symbols.length)]
                    ];
                    
                    slots.forEach((slotId, index) => {
                        document.getElementById(slotId).textContent = results[index];
                    });

                    if (results[0] === results[1] && results[1] === results[2]) {
                        const winAmount = bet * 10;
                        userData.balance += winAmount;
                        showResult(`ДЖЕКПОТ! Вы выиграли ${winAmount} USD!`, 'win');
                        sendGameResult('slots', true, winAmount);
                    } else if (results[0] === results[1] || results[1] === results[2]) {
                        const winAmount = bet * 2;
                        userData.balance += winAmount;
                        showResult(`Вы выиграли ${winAmount} USD!`, 'win');
                        sendGameResult('slots', true, winAmount);
                    } else {
                        showResult('Повезет в следующий раз!', 'lose');
                        sendGameResult('slots', false, 0);
                    }
                    updateBalance();
                }
            }, 100);
        }

        // Игра: Рулетка (ИСПРАВЛЕННАЯ)
        function getRouletteHTML() {
            return `
                <h2>🎡 Европейская рулетка</h2>
                <div class="bet-controls">
                    <span>Ставка: <span id="rouletteBet">${userData.bets.roulette}</span> USD</span>
                    <div>
                        <button class="bet-btn" onclick="changeBet('roulette', -10)">-10</button>
                        <button class="bet-btn" onclick="changeBet('roulette', 10)">+10</button>
                    </div>
                </div>
                
                <div class="roulette-wheel" id="rouletteWheel">
                    <div class="roulette-ball"></div>
                    <div class="roulette-marker"></div>
                </div>
                
                <div class="bet-options">
                    <button class="bet-option red" onclick="selectRouletteBet('red')">🔴 Красное (x2)</button>
                    <button class="bet-option black" onclick="selectRouletteBet('black')">⚫ Черное (x2)</button>
                    <button class="bet-option green" onclick="selectRouletteBet('green')">🟢 Зеленое (x14)</button>
                    <button class="bet-option even" onclick="selectRouletteBet('even')">📊 Четное (x2)</button>
                    <button class="bet-option odd" onclick="selectRouletteBet('odd')">🔢 Нечетное (x2)</button>
                    <button class="bet-option low" onclick="selectRouletteBet('low')">🔽 1-18 (x2)</button>
                    <button class="bet-option high" onclick="selectRouletteBet('high')">🔼 19-36 (x2)</button>
                </div>
                
                <button class="spin-btn" id="spinRoulette" onclick="spinRoulette()" disabled>🎡 Крутить рулетку</button>
                
                <div class="roulette-history" id="rouletteHistory"></div>
                <div id="rouletteResult"></div>
            `;
        }

        function initRoulette() {
            updateRouletteHistory();
            rouletteData.spinning = false;
            rouletteData.currentBet = null;
            
            // Сбрасываем активные кнопки
            document.querySelectorAll('.bet-option').forEach(btn => {
                btn.classList.remove('active');
            });
            document.getElementById('spinRoulette').disabled = true;
        }

        function selectRouletteBet(type) {
            if (rouletteData.spinning) return;
            
            // Сбрасываем предыдущий выбор
            document.querySelectorAll('.bet-option').forEach(btn => {
                btn.classList.remove('active');
            });
            
            // Активируем выбранную кнопку
            event.target.classList.add('active');
            rouletteData.currentBet = type;
            document.getElementById('spinRoulette').disabled = false;
        }

        function spinRoulette() {
            if (rouletteData.spinning || !rouletteData.currentBet) return;
            
            const bet = userData.bets.roulette;
            if (userData.balance < bet) {
                showRouletteResult('Недостаточно средств!', 'lose');
                return;
            }

            userData.balance -= bet;
            updateBalance();
            rouletteData.spinning = true;
            document.getElementById('spinRoulette').disabled = true;

            const wheel = document.getElementById('rouletteWheel');
            const randomSpin = 1800 + Math.random() * 3600; // 5-10 полных оборотов
            wheel.style.transform = `rotate(${randomSpin}deg)`;

            // Определяем выигрышный номер после вращения
            setTimeout(() => {
                const totalDegrees = randomSpin % 360;
                const winningIndex = Math.floor((360 - totalDegrees) / (360 / 37));
                const winningNumber = rouletteData.numbers[winningIndex % 37];
                
                let winningType = '';
                let multiplier = 1;
                
                if (winningNumber === 0) {
                    winningType = 'green';
                    multiplier = 14;
                } else if (rouletteData.redNumbers.includes(winningNumber)) {
                    winningType = 'red';
                    multiplier = 2;
                } else {
                    winningType = 'black';
                    multiplier = 2;
                }
                
                // Проверяем дополнительные условия
                const isEven = winningNumber % 2 === 0 && winningNumber !== 0;
                const isLow = winningNumber >= 1 && winningNumber <= 18;
                const isHigh = winningNumber >= 19 && winningNumber <= 36;

                // Сохраняем в историю
                rouletteData.history.unshift({
                    number: winningNumber,
                    type: winningType,
                    even: isEven,
                    low: isLow
                });
                
                if (rouletteData.history.length > 10) {
                    rouletteData.history.pop();
                }
                
                updateRouletteHistory();

                // Проверяем выигрыш
                let won = false;
                if (rouletteData.currentBet === winningType) {
                    won = true;
                } else if (rouletteData.currentBet === 'even' && isEven) {
                    won = true;
                } else if (rouletteData.currentBet === 'odd' && !isEven && winningNumber !== 0) {
                    won = true;
                } else if (rouletteData.currentBet === 'low' && isLow) {
                    won = true;
                } else if (rouletteData.currentBet === 'high' && isHigh) {
                    won = true;
                }

                if (won) {
                    const winAmount = bet * multiplier;
                    userData.balance += winAmount;
                    showRouletteResult(`Выигрыш! Выпало ${winningNumber} (${winningType}). Вы выиграли ${winAmount} USD!`, 'win');
                    sendGameResult('roulette', true, winAmount);
                } else {
                    showRouletteResult(`Проигрыш! Выпало ${winningNumber} (${winningType})`, 'lose');
                    sendGameResult('roulette', false, 0);
                }
                
                updateBalance();
                rouletteData.spinning = false;
                
                // Через 2 секунды разрешаем снова делать ставки
                setTimeout(() => {
                    document.querySelectorAll('.bet-option').forEach(btn => {
                        btn.classList.remove('active');
                    });
                    rouletteData.currentBet = null;
                    document.getElementById('spinRoulette').disabled = false;
                }, 2000);
                
            }, 4000);
        }

        function updateRouletteHistory() {
            const historyContainer = document.getElementById('rouletteHistory');
            historyContainer.innerHTML = '';
            
            rouletteData.history.forEach(item => {
                const historyItem = document.createElement('div');
                historyItem.className = `history-item ${item.type}`;
                historyItem.textContent = item.number;
                historyContainer.appendChild(historyItem);
            });
        }

        // Остальные игры (Блэкджек и Покер) остаются без изменений
        function getBlackjackHTML() {
            return `
                <h2>♠️ Блэкджек</h2>
                <div class="bet-controls">
                    <span>Ставка: <span id="blackjackBet">${userData.bets.blackjack}</span> USD</span>
                    <div>
                        <button class="bet-btn" onclick="changeBet('blackjack', -5)">-5</button>
                        <button class="bet-btn" onclick="changeBet('blackjack', 5)">+5</button>
                    </div>
                </div>
                
                <div class="blackjack-table">
                    <h3>Диллер</h3>
                    <div class="hand" id="dealerHand"></div>
                    
                    <h3>Игрок</h3>
                    <div class="hand" id="playerHand"></div>
                    
                    <div class="game-controls" id="blackjackControls">
                        <button class="control-btn hit" onclick="blackjackHit()">Взять</button>
                        <button class="control-btn stand" onclick="blackjackStand()">Пас</button>
                        <button class="control-btn double" onclick="blackjackDouble()">Удвоить</button>
                        <button class="control-btn deal" onclick="startBlackjack()">Раздать карты</button>
                    </div>
                </div>
                <div id="blackjackResult"></div>
            `;
        }

        function getPokerHTML() {
            return `
                <h2>🃏 Техасский Холдем</h2>
                <div class="bet-controls">
                    <span>Ставка: <span id="pokerBet">${userData.bets.poker}</span> USD</span>
                    <div>
                        <button class="bet-btn" onclick="changeBet('poker', -5)">-5</button>
                        <button class="bet-btn" onclick="changeBet('poker', 5)">+5</button>
                    </div>
                </div>
                
                <div class="poker-table">
                    <h3>Общие карты</h3>
                    <div class="community-cards" id="communityCards"></div>
                    
                    <h3>Ваша рука</h3>
                    <div class="poker-hand" id="playerPokerHand"></div>
                    
                    <div class="poker-controls" id="pokerControls">
                        <button class="control-btn fold" onclick="pokerFold()">Фолд</button>
                        <button class="control-btn check" onclick="pokerCheck()">Чек</button>
                        <button class="control-btn bet" onclick="pokerBet()">Ставка</button>
                        <button class="control-btn raise" onclick="pokerRaise()">Поднять</button>
                        <button class="control-btn deal" onclick="startPoker()" style="grid-column: span 2;">Начать игру</button>
                    </div>
                </div>
                <div id="pokerResult"></div>
            `;
        }

        // Общие функции
        function changeBet(game, amount) {
            userData.bets[game] = Math.max(5, userData.bets[game] + amount);
            document.getElementById(game + 'Bet').textContent = userData.bets[game];
        }

        function updateBalance() {
            document.getElementById('balanceAmount').textContent = userData.balance.toFixed(2) + ' USD';
        }

        function showResult(message, type) {
            const resultDiv = document.getElementById('slotsResult');
            resultDiv.innerHTML = `<div class="result-message ${type}">${message}</div>`;
        }

        function showRouletteResult(message, type) {
            const resultDiv = document.getElementById('rouletteResult');
            resultDiv.innerHTML = `<div class="result-message ${type}">${message}</div>`;
        }

        // Функция отправки результатов в бота
        function sendGameResult(game, won, amount) {
            if (tg.sendData) {
                const gameData = {
                    game: game,
                    won: won,
                    amount: amount,
                    balance: userData.balance,
                    timestamp: Date.now()
                };
                tg.sendData(JSON.stringify(gameData));
            }
        }

        // Заглушки для остальных игр (реализация которых уже была в предыдущем коде)
        function initSlots() {}
        function initBlackjack() {}
        function initPoker() {}
        function startBlackjack() {}
        function blackjackHit() {}
        function blackjackStand() {}
        function blackjackDouble() {}
        function startPoker() {}
        function pokerFold() {}
        function pokerCheck() {}
        function pokerBet() {}
        function pokerRaise() {}
    </script>
</body>
</html>
