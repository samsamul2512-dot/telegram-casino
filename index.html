<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Casino</title>
    <style>
        /* ВОССТАНОВЛЕННЫЕ ПОЛНЫЕ СТИЛИ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0c0f1d 0%, #1a1f3b 100%);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            position: relative;
            overflow: hidden;
        }

        /* Анимированный фон */
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: radial-gradient(circle at 20% 80%, rgba(41, 128, 185, 0.1) 0%, transparent 50%),
                        radial-gradient(circle at 80% 20%, rgba(231, 76, 60, 0.1) 0%, transparent 50%),
                        radial-gradient(circle at 40% 40%, rgba(46, 204, 113, 0.1) 0%, transparent 50%);
            animation: pulse 15s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        /* Главный экран */
        #mainScreen {
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .header {
            text-align: center;
            padding: 20px 0;
            position: relative;
            overflow: hidden;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .header h1 {
            font-size: 2.2rem;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #FFD700, #FFA500, #FF8C00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
        }

        .header p {
            font-size: 1rem;
            opacity: 0.8;
        }

        .balance-card {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: transform 0.3s ease;
        }

        .balance-card:hover {
            transform: translateY(-5px);
        }

        .balance-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            transform: translateX(-100%);
            transition: transform 0.6s;
        }

        .balance-card:hover::before {
            transform: translateX(100%);
        }

        .balance-card > div:first-child {
            font-size: 0.9rem;
            opacity: 0.8;
            margin-bottom: 5px;
        }

        .balance-amount {
            font-size: 2rem;
            font-weight: bold;
            margin: 10px 0;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        .balance-card > div:last-child {
            font-size: 0.8rem;
            opacity: 0.7;
        }

        /* Сетка игр */
        .games-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .game-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 120px;
        }

        .game-card:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
        }

        .game-icon {
            font-size: 2.5rem;
            margin-bottom: 10px;
            filter: drop-shadow(0 0 5px rgba(255, 255, 255, 0.5));
        }

        .game-card:nth-child(1) .game-icon { color: #FFD700; }
        .game-card:nth-child(2) .game-icon { color: #FF6347; }
        .game-card:nth-child(3) .game-icon { color: #1E90FF; }
        .game-card:nth-child(4) .game-icon { color: #32CD32; }

        /* Кнопки */
        .spin-btn {
            background: linear-gradient(135deg, #FF8C00 0%, #FFA500 100%);
            border: none;
            border-radius: 50px;
            color: white;
            padding: 15px 30px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(255, 140, 0, 0.4);
            width: 100%;
            margin-top: 10px;
        }

        .spin-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(255, 140, 0, 0.6);
        }

        .spin-btn:active {
            transform: translateY(1px);
        }

        /* Модальное окно */
        .game-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            backdrop-filter: blur(5px);
        }

        .modal-content {
            position: relative;
            background: linear-gradient(135deg, #1a1f3b 0%, #0c0f1d 100%);
            margin: 5% auto;
            padding: 30px;
            width: 95%;
            max-width: 500px;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-height: 90vh;
            overflow-y: auto;
        }

        .close-modal {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 2rem;
            cursor: pointer;
            color: rgba(255, 255, 255, 0.7);
            transition: color 0.3s;
            z-index: 10;
        }

        .close-modal:hover {
            color: white;
        }

        /* Элементы управления ставками */
        .bet-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 15px;
            margin: 20px 0;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .bet-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin: 0 5px;
            transition: all 0.3s ease;
        }

        .bet-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.1);
        }

        /* Рулетка */
        .roulette-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 20px 0;
        }

        .roulette-wheel {
            width: 250px;
            height: 250px;
            margin: 20px auto;
            border: 8px solid #FFD700;
            border-radius: 50%;
            position: relative;
            overflow: hidden;
            transition: transform 4s cubic-bezier(0.1, 0.8, 0.2, 1);
            background: conic-gradient(
                #0a5f38 0deg 10deg,
                #000 10deg 20deg,
                #c00 20deg 30deg,
                #000 30deg 40deg,
                #c00 40deg 50deg,
                #000 50deg 60deg,
                #c00 60deg 70deg,
                #000 70deg 80deg,
                #c00 80deg 90deg,
                #000 90deg 100deg,
                #c00 100deg 110deg,
                #000 110deg 120deg,
                #c00 120deg 130deg,
                #000 130deg 140deg,
                #c00 140deg 150deg,
                #000 150deg 160deg,
                #c00 160deg 170deg,
                #000 170deg 180deg,
                #c00 180deg 190deg,
                #000 190deg 200deg,
                #c00 200deg 210deg,
                #000 210deg 220deg,
                #c00 220deg 230deg,
                #000 230deg 240deg,
                #c00 240deg 250deg,
                #000 250deg 260deg,
                #c00 260deg 270deg,
                #000 270deg 280deg,
                #c00 280deg 290deg,
                #000 290deg 300deg,
                #c00 300deg 310deg,
                #000 310deg 320deg,
                #c00 320deg 330deg,
                #000 330deg 340deg,
                #c00 340deg 350deg,
                #000 350deg 360deg
            );
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.5);
        }

        .roulette-ball {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: 20px;
            height: 20px;
            background: radial-gradient(circle at 30% 30%, #FFD700, #FFA500);
            border-radius: 50%;
            z-index: 10;
            box-shadow: 0 0 10px gold;
        }

        .roulette-marker {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 3px;
            height: 25px;
            background: white;
            z-index: 5;
            box-shadow: 0 0 10px white;
        }

        .bet-options {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin: 20px 0;
            width: 100%;
        }

        .bet-option {
            padding: 15px 10px;
            border: none;
            border-radius: 10px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .bet-option.red { 
            background: linear-gradient(135deg, #c00 0%, #a00 100%);
        }
        .bet-option.black { 
            background: linear-gradient(135deg, #000 0%, #333 100%);
        }
        .bet-option.green { 
            background: linear-gradient(135deg, #0a5f38 0%, #0a3f28 100%);
        }
        .bet-option.even { 
            background: linear-gradient(135deg, #2196F3 0%, #0d47a1 100%);
        }
        .bet-option.odd { 
            background: linear-gradient(135deg, #FF9800 0%, #E65100 100%);
        }
        .bet-option.low { 
            background: linear-gradient(135deg, #9C27B0 0%, #4A148C 100%);
        }
        .bet-option.high { 
            background: linear-gradient(135deg, #607D8B 0%, #37474F 100%);
        }

        .bet-option.active {
            transform: scale(1.05);
            box-shadow: 0 0 15px gold;
            border: 2px solid gold;
        }

        .bet-option:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }

        .roulette-history {
            display: flex;
            gap: 8px;
            margin: 20px 0;
            justify-content: center;
            flex-wrap: wrap;
        }

        .history-item {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
            color: white;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.2);
        }

        .history-item.red { background: #c00; }
        .history-item.black { background: #000; }
        .history-item.green { background: #0a5f38; }

        /* Сообщения о результате */
        .result-message {
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            font-weight: bold;
            margin: 20px 0;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            animation: fadeIn 0.5s ease;
        }

        .result-message.win {
            background: linear-gradient(135deg, #4CAF50 0%, #2E7D32 100%);
            border: 1px solid #81C784;
        }

        .result-message.lose {
            background: linear-gradient(135deg, #F44336 0%, #C62828 100%);
            border: 1px solid #EF5350;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Слоты */
        .slots-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 30px 0;
        }

        .slot {
            width: 80px;
            height: 80px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
        }

        .slot.spinning {
            animation: slotSpin 0.2s infinite;
        }

        @keyframes slotSpin {
            0% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0); }
        }

        /* Карточные игры */
        .blackjack-table, .poker-table {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 20px;
            margin: 20px 0;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .cards {
            display: flex;
            gap: 10px;
            margin: 15px 0;
            flex-wrap: wrap;
            justify-content: center;
        }

        .card {
            width: 60px;
            height: 80px;
            background: white;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: #333;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.3);
            border: 2px solid #ddd;
        }

        .card.hidden {
            background: linear-gradient(45deg, #1e3c72, #2a5298);
            color: white;
            font-size: 2rem;
        }

        .dealer-hand, .player-hand, .community-cards {
            margin: 20px 0;
            text-align: center;
        }

        .dealer-hand h3, .player-hand h3 {
            margin-bottom: 10px;
            color: #FFD700;
        }

        /* Адаптивность */
        @media (max-width: 480px) {
            .games-grid {
                grid-template-columns: 1fr;
            }
            
            .bet-options {
                grid-template-columns: 1fr;
            }
            
            .roulette-wheel {
                width: 200px;
                height: 200px;
            }
            
            .slot {
                width: 70px;
                height: 70px;
                font-size: 2rem;
            }
            
            .card {
                width: 50px;
                height: 70px;
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>
    <div class="bg-animation"></div>
    <div class="container">
        <!-- Главный экран -->
        <div id="mainScreen">
            <div class="header">
                <h1>🎰 Crypto Casino</h1>
                <p>Ваш путь к большим выигрышам!</p>
            </div>

            <div class="balance-card">
                <div>Ваш баланс</div>
                <div class="balance-amount" id="balanceAmount">1240.00 USD</div>
                <div>ID: <span id="userId">123456</span></div>
            </div>

            <div class="games-grid">
                <div class="game-card" onclick="casino.openGame('slots')">
                    <div class="game-icon">🎰</div>
                    <div>Слоты</div>
                </div>
                <div class="game-card" onclick="casino.openGame('roulette')">
                    <div class="game-icon">🎡</div>
                    <div>Рулетка</div>
                </div>
                <div class="game-card" onclick="casino.openGame('blackjack')">
                    <div class="game-icon">♠️</div>
                    <div>Блэкджек</div>
                </div>
                <div class="game-card" onclick="casino.openGame('poker')">
                    <div class="game-icon">🃏</div>
                    <div>Покер</div>
                </div>
            </div>

            <button class="spin-btn" onclick="casino.refreshBalance()">🔄 Обновить баланс</button>
        </div>

        <!-- Модальное окно для игр -->
        <div id="gameModal" class="game-modal">
            <div class="modal-content">
                <span class="close-modal" onclick="casino.closeGame()">×</span>
                <div id="gameContent"></div>
            </div>
        </div>
    </div>

    <script>
        // Здесь должен быть JavaScript код из предыдущего ответа
        // (полная версия с классами Casino, BaseGame, SlotsGame, RouletteGame, BlackjackGame, PokerGame)
        // Чтобы не перегружать ответ, вставлю сокращенную версию:

        class Casino {
            constructor() {
                this.tg = window.Telegram?.WebApp || {};
                this.userData = {
                    balance: 1240.00,
                    userId: '123456',
                    bets: { slots: 10, roulette: 50, blackjack: 25, poker: 30 }
                };
                this.init();
            }

            init() {
                this.updateBalanceDisplay();
            }

            updateBalanceDisplay() {
                document.getElementById('balanceAmount').textContent = 
                    this.userData.balance.toFixed(2) + ' USD';
            }

            openGame(gameType) {
                // Реализация открытия игры
                console.log('Opening game:', gameType);
            }

            closeGame() {
                document.getElementById('gameModal').style.display = 'none';
            }

            refreshBalance() {
                this.userData.balance += 100;
                this.updateBalanceDisplay();
            }
        }

        // Инициализация казино
        const casino = new Casino();
        window.casino = casino;
    </script>
</body>
</html>
