<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PvP Roulette</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0c0c0c 0%, #1a1a1a 100%);
            color: white;
            min-height: 100vh;
            padding-bottom: 80px;
        }

        .container {
            max-width: 400px;
            margin: 0 auto;
            padding: 10px;
        }

        .tournament-header {
            background: linear-gradient(135deg, #ff6b35 0%, #f7931e 100%);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 10px;
            text-align: center;
        }

        .player-list {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            margin-bottom: 10px;
            padding: 10px;
            max-height: 300px;
            overflow-y: auto;
        }

        .player-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .player-item:last-child {
            border-bottom: none;
        }

        .player-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .player-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .player-stats {
            text-align: right;
        }

        .player-bet {
            color: #f7931e;
            font-weight: bold;
            font-size: 1.1em;
        }

        .player-chance {
            color: #00ff88;
            font-size: 0.9em;
        }

        .top-player {
            background: rgba(247, 147, 30, 0.2);
            border-radius: 8px;
            border-left: 3px solid #f7931e;
        }

        .prize-pool {
            background: rgba(0, 255, 136, 0.1);
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 10px;
        }

        .prize-amount {
            font-size: 1.5em;
            font-weight: bold;
            color: #00ff88;
            margin: 5px 0;
        }

        .timer-section {
            background: rgba(255, 107, 53, 0.1);
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 10px;
        }

        .timer {
            font-size: 2em;
            font-weight: bold;
            color: #ff6b35;
        }

        /* Рулетка */
        .roulette-container {
            position: relative;
            margin: 15px 0;
            text-align: center;
        }

        .roulette-wheel {
            width: 250px;
            height: 250px;
            margin: 0 auto;
            border: 5px solid #f7931e;
            border-radius: 50%;
            position: relative;
            background: conic-gradient(
                from 0deg,
                #ff6b35 0deg 120deg,
                #00ff88 120deg 240deg,
                #667eea 240deg 360deg
            );
            box-shadow: 0 0 30px rgba(247, 147, 30, 0.5);
            transition: transform 3s cubic-bezier(0.1, 0.8, 0.2, 1);
        }

        .roulette-pointer {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-top: 20px solid #ff6b35;
            z-index: 10;
        }

        .betting-controls {
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 10px;
        }

        .bet-amount {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .bet-input {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid #f7931e;
            color: white;
            padding: 10px;
            border-radius: 5px;
            width: 100px;
            text-align: center;
            font-size: 1em;
        }

        .bet-buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 5px;
            margin-bottom: 15px;
        }

        .quick-bet {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid #f7931e;
            color: white;
            padding: 8px;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .quick-bet:hover {
            background: rgba(247, 147, 30, 0.3);
        }

        .quick-bet.active {
            background: #f7931e;
            color: black;
        }

        .place-bet-btn {
            background: linear-gradient(135deg, #ff6b35 0%, #f7931e 100%);
            border: none;
            color: white;
            padding: 15px;
            border-radius: 25px;
            font-size: 1.1em;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s;
        }

        .place-bet-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(247, 147, 30, 0.4);
        }

        .place-bet-btn:disabled {
            background: gray;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* Нижнее меню */
        .bottom-menu {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px);
            padding: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .menu-buttons {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 5px;
            max-width: 400px;
            margin: 0 auto;
        }

        .menu-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: white;
            padding: 10px 5px;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            font-size: 0.8em;
            transition: all 0.3s;
        }

        .menu-btn.active {
            background: linear-gradient(135deg, #ff6b35 0%, #f7931e 100%);
        }

        .menu-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* Результаты */
        .results {
            background: rgba(0, 255, 136, 0.1);
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
            display: none;
            text-align: center;
        }

        .winner-info {
            text-align: center;
            font-size: 1.2em;
            margin: 10px 0;
            color: #00ff88;
        }

        .winner-prize {
            color: #00ff88;
            font-weight: bold;
        }

        .balance-display {
            text-align: center;
            font-size: 1.2em;
            margin: 10px 0;
            color: #f7931e;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="tournament-header">
            <h2>🎯 PvP Рулетка</h2>
            <p>Максимум 10 участников</p>
        </div>

        <div class="balance-display">
            Ваш баланс: <span id="userBalance">1000</span> USDT
        </div>

        <div class="player-list" id="playerList">
            <!-- Игроки будут здесь -->
        </div>

        <div class="prize-pool">
            <div>Призовой фонд</div>
            <div class="prize-amount" id="totalPot">0 USDT</div>
            <div>Комиссия казино: 5%</div>
        </div>

        <div class="timer-section">
            <div>Старт через</div>
            <div class="timer" id="timer">00:30</div>
            <div>Следующий раунд</div>
        </div>

        <div class="roulette-container">
            <div class="roulette-pointer"></div>
            <div class="roulette-wheel" id="rouletteWheel"></div>
        </div>

        <div class="betting-controls">
            <div class="bet-amount">
                <span>Ваша ставка:</span>
                <input type="number" class="bet-input" id="betAmount" value="10" min="1" max="1000">
                <span>USDT</span>
            </div>

            <div class="bet-buttons">
                <button class="quick-bet" onclick="setBet(5)">5 USDT</button>
                <button class="quick-bet" onclick="setBet(10)">10 USDT</button>
                <button class="quick-bet" onclick="setBet(25)">25 USDT</button>
                <button class="quick-bet" onclick="setBet(50)">50 USDT</button>
                <button class="quick-bet" onclick="setBet(100)">100 USDT</button>
                <button class="quick-bet" onclick="setBet(250)">250 USDT</button>
                <button class="quick-bet" onclick="setBet(500)">500 USDT</button>
                <button class="quick-bet" onclick="setBet(1000)">1000 USDT</button>
            </div>

            <button class="place-bet-btn" id="placeBetBtn" onclick="placeBet()">🎯 Сделать ставку</button>
        </div>

        <div class="results" id="results">
            <h3>🎉 Победитель раунда!</h3>
            <div class="winner-info" id="winnerInfo"></div>
            <div>Выигрыш: <span class="winner-prize" id="winnerPrize">0 USDT</span></div>
            <div>Комиссия казино: <span id="casinoCommission">0 USDT</span></div>
        </div>
    </div>

    <!-- Нижнее меню -->
    <div class="bottom-menu">
        <div class="menu-buttons">
            <button class="menu-btn active" onclick="showScreen('pvp')">ПвП</button>
            <button class="menu-btn" onclick="showScreen('solo')">Соло</button>
            <button class="menu-btn" onclick="showBalance()">Баланс</button>
        </div>
    </div>

    <script>
        // Telegram WebApp API
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Данные игры
        const gameState = {
            balance: 1000,
            currentBet: 10,
            players: [],
            totalPot: 0,
            roundTime: 30,
            timer: null,
            isBettingPhase: true,
            casinoCommission: 0.05, // 5% комиссия
            maxPlayers: 10,
            currentScreen: 'pvp'
        };

        // Инициализация
        document.addEventListener('DOMContentLoaded', function() {
            updateBalanceDisplay();
            simulateOtherPlayers();
            startRoundTimer();
            updatePlayerList();
            setupEventListeners();
        });

        function setupEventListeners() {
            // Обработка изменения ставки
            document.getElementById('betAmount').addEventListener('input', function() {
                const value = parseInt(this.value);
                if (!isNaN(value) && value > 0) {
                    gameState.currentBet = value;
                    updateQuickBetButtons();
                }
            });

            // Проверка ввода ставки
            document.getElementById('betAmount').addEventListener('blur', function() {
                if (this.value === '' || parseInt(this.value) < 1) {
                    this.value = 10;
                    gameState.currentBet = 10;
                }
                updateQuickBetButtons();
            });
        }

        // Установка ставки
        function setBet(amount) {
            gameState.currentBet = amount;
            document.getElementById('betAmount').value = amount;
            updateQuickBetButtons();
        }

        function updateQuickBetButtons() {
            document.querySelectorAll('.quick-bet').forEach(btn => {
                btn.classList.remove('active');
                if (parseInt(btn.textContent) === gameState.currentBet) {
                    btn.classList.add('active');
                }
            });
        }

        // Размещение ставки
        function placeBet() {
            if (!gameState.isBettingPhase) {
                alert('Ставки в этом раунде закрыты! Ожидайте следующий раунд.');
                return;
            }

            if (gameState.currentBet > gameState.balance) {
                alert('Недостаточно средств на балансе!');
                return;
            }

            if (gameState.players.length >= gameState.maxPlayers) {
                alert('Достигнуто максимальное количество игроков (10)!');
                return;
            }

            // Проверяем, не сделал ли уже игрок ставку
            const existingPlayerIndex = gameState.players.findIndex(p => p.id === 'you');
            if (existingPlayerIndex !== -1) {
                alert('Вы уже сделали ставку в этом раунде!');
                return;
            }

            // Добавляем игрока
            gameState.players.push({
                id: 'you',
                name: 'Вы',
                bet: gameState.currentBet,
                chance: 0
            });

            gameState.balance -= gameState.currentBet;
            updateBalanceDisplay();
            updateChances();
            updatePlayerList();

            // Блокируем кнопку после ставки
            document.getElementById('placeBetBtn').disabled = true;

            // Отправляем данные в бота
            sendBetToBot();
        }

        // Расчет шансов на основе ставок
        function updateChances() {
            const totalBets = gameState.players.reduce((sum, player) => sum + player.bet, 0);
            gameState.totalPot = totalBets;
            
            gameState.players.forEach(player => {
                player.chance = (player.bet / totalBets) * 100;
            });

            document.getElementById('totalPot').textContent = totalBets.toFixed(2) + ' USDT';
        }

        // Обновление списка игроков
        function updatePlayerList() {
            const container = document.getElementById('playerList');
            container.innerHTML = '';

            // Сортируем игроков по размеру ставки
            const sortedPlayers = [...gameState.players].sort((a, b) => b.bet - a.bet);

            sortedPlayers.forEach((player, index) => {
                const playerElement = document.createElement('div');
                playerElement.className = `player-item ${index === 0 ? 'top-player' : ''}`;
                
                playerElement.innerHTML = `
                    <div class="player-info">
                        <div class="player-avatar">${player.name.charAt(0)}</div>
                        <div>
                            <div>${player.name}</div>
                            ${index === 0 ? '<div style="color: #f7931e; font-size: 0.8em;">ЛИДЕР</div>' : ''}
                        </div>
                    </div>
                    <div class="player-stats">
                        <div class="player-bet">${player.bet} USDT</div>
                        <div class="player-chance">${player.chance.toFixed(1)}%</div>
                    </div>
                `;

                container.appendChild(playerElement);
            });

            // Показываем количество игроков
            if (sortedPlayers.length === 0) {
                container.innerHTML = '<div style="text-align: center; padding: 20px; color: #666;">Ожидаем ставок...</div>';
            }
        }

        // Таймер раунда
        function startRoundTimer() {
            let timeLeft = gameState.roundTime;
            updateTimerDisplay(timeLeft);
            
            gameState.timer = setInterval(() => {
                timeLeft--;
                updateTimerDisplay(timeLeft);
                
                if (timeLeft <= 0) {
                    clearInterval(gameState.timer);
                    endBettingPhase();
                }
            }, 1000);
        }

        function updateTimerDisplay(seconds) {
            document.getElementById('timer').textContent = 
                `00:${seconds.toString().padStart(2, '0')}`;
        }

        function endBettingPhase() {
            gameState.isBettingPhase = false;
            document.getElementById('placeBetBtn').disabled = true;
            
            if (gameState.players.length < 2) {
                // Если игроков меньше 2, возвращаем ставку и начинаем новый раунд
                if (gameState.players.length === 1) {
                    const player = gameState.players[0];
                    gameState.balance += player.bet;
                    updateBalanceDisplay();
                    alert(`Недостаточно игроков! Ваша ставка ${player.bet} USDT возвращена.`);
                }
                startNewRound();
                return;
            }

            document.getElementById('timer').textContent = 'Крутим...';
            spinRoulette();
        }

        // Вращение рулетки
        function spinRoulette() {
            const wheel = document.getElementById('rouletteWheel');
            
            // Создаем взвешенный массив для выбора победителя
            let weightedArray = [];
            gameState.players.forEach((player, index) => {
                const entries = Math.max(1, Math.floor(player.chance));
                for (let i = 0; i < entries; i++) {
                    weightedArray.push(index);
                }
            });

            // Случайный выбор победителя
            const randomIndex = weightedArray[Math.floor(Math.random() * weightedArray.length)];
            const winner = gameState.players[randomIndex];

            // Анимация вращения
            const spins = 5 + (randomIndex / gameState.players.length);
            wheel.style.transform = `rotate(${spins * 360}deg)`;

            // Показ результатов
            setTimeout(() => {
                showResults(winner);
            }, 3500);
        }

        // Показ результатов
        function showResults(winner) {
            const commission = gameState.totalPot * gameState.casinoCommission;
            const winnerPrize = gameState.totalPot - commission;

            document.getElementById('results').style.display = 'block';
            document.getElementById('winnerInfo').textContent = `${winner.name} побеждает!`;
            document.getElementById('winnerPrize').textContent = winnerPrize.toFixed(2) + ' USDT';
            document.getElementById('casinoCommission').textContent = commission.toFixed(2) + ' USDT';

            // Начисляем выигрыш если победил текущий игрок
            if (winner.id === 'you') {
                gameState.balance += winnerPrize;
                updateBalanceDisplay();
                sendWinToBot(winnerPrize, commission);
            }

            // Новый раунд через 5 секунд
            setTimeout(() => {
                startNewRound();
            }, 5000);
        }

        function startNewRound() {
            gameState.isBettingPhase = true;
            gameState.players = [];
            gameState.totalPot = 0;
            
            document.getElementById('results').style.display = 'none';
            document.getElementById('rouletteWheel').style.transform = 'rotate(0deg)';
            document.getElementById('totalPot').textContent = '0 USDT';
            document.getElementById('placeBetBtn').disabled = false;
            
            updatePlayerList();
            startRoundTimer();
        }

        // Симуляция других игроков
        function simulateOtherPlayers() {
            setInterval(() => {
                if (gameState.isBettingPhase && 
                    gameState.players.length < gameState.maxPlayers && 
                    Math.random() > 0.7) {
                    
                    const names = ['Alex', 'Maria', 'John', 'Anna', 'Mike', 'Sarah', 'David', 'Laura'];
                    const bets = [5, 10, 15, 20, 25, 50, 75, 100];
                    
                    const newPlayer = {
                        id: 'bot_' + Date.now(),
                        name: names[Math.floor(Math.random() * names.length)],
                        bet: bets[Math.floor(Math.random() * bets.length)],
                        chance: 0
                    };

                    // Проверяем, чтобы боты не ставили больше чем есть у игрока в балансе (для реалистичности)
                    if (newPlayer.bet <= gameState.balance * 2) {
                        gameState.players.push(newPlayer);
                        updateChances();
                        updatePlayerList();
                    }
                }
            }, 2000);
        }

        function updateBalanceDisplay() {
            document.getElementById('userBalance').textContent = gameState.balance.toFixed(2);
        }

        function sendBetToBot() {
            if (tg && tg.sendData) {
                const betData = {
                    type: 'pvp_bet',
                    bet: gameState.currentBet,
                    timestamp: Date.now()
                };
                tg.sendData(JSON.stringify(betData));
            }
        }

        function sendWinToBot(prize, commission) {
            if (tg && tg.sendData) {
                const winData = {
                    type: 'pvp_win',
                    prize: prize,
                    commission: commission,
                    timestamp: Date.now()
                };
                tg.sendData(JSON.stringify(winData));
            }
        }

        // Навигация по экранам
        function showScreen(screen) {
            gameState.currentScreen = screen;
            
            // Обновляем активные кнопки меню
            document.querySelectorAll('.menu-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            
            // Здесь можно добавить логику переключения между экранами
            if (screen === 'pvp') {
                // Уже показываем PvP
            } else if (screen === 'solo') {
                alert('Режим Соло в разработке');
            }
        }

        function showBalance() {
            alert(`Ваш текущий баланс: ${gameState.balance.toFixed(2)} USDT`);
        }

        // Обработка данных от бота
        if (tg && tg.onEvent) {
            tg.onEvent('webAppDataReceived', (data) => {
                try {
                    const gameData = JSON.parse(data);
                    if (gameData.type === 'balance_update') {
                        gameState.balance = gameData.balance;
                        updateBalanceDisplay();
                    }
                } catch (e) {
                    console.error('Error parsing data from bot:', e);
                }
            });
        }

        // Инициализация кнопок при загрузке
        updateQuickBetButtons();
    </script>
</body>
</html>
